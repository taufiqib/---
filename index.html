    q.options.forEach(function(o, oi){ h += "<li>" + LETTERS[oi] + ". " + esc(o) + "</li>"; });
    h += "</ul></div>";
  });
  h += "<h2 class='ans'>✅ דף תשובות</h2>";
  questions.forEach(function(q, i){
    h += "<div class='a'><b>" + (i+1) + ". " + LETTERS[q.answer] + "</b> — " + esc(q.explain || "") + "</div>";
  });
  h += "<div class='foot'>ניהול מערכות מידע · ד\"ר שי צבאן · המרכז האקדמי פרס · Soulware · Taufiq Ibrahim</div></body></html>";
  var w = window.open("", "_blank");
  if(!w){ alert("הדפדפן חסם את חלון ההדפסה — יש לאפשר חלונות קופצים לאתר זה."); return; }
  w.document.open(); w.document.write(h); w.document.close();
  w.focus();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 500);
}

/* ---------- יחידות ---------- */
function openUnit(id, tab){
  var u = UNITS.filter(function(x){ return x.id === id; })[0];
  if(!u) return;
  current = { unit: u, tab: tab || "summary" };
  markNav("nav-u" + id);
  homeView.classList.add("hidden");
  unitView.classList.remove("hidden");
  renderUnit();
  window.scrollTo(0,0);
}

function renderUnit(){
  var u = current.unit;
  var html = "<div class='unit-head'>" +
    "<button class='back-btn' id='backBtn'>→ חזרה</button>" +
    "<h2>" + u.icon + " יחידה " + u.id + " — " + u.title + "</h2>" +
    "<button class='back-btn print-btn' id='printBtn'>🖨️ הדפסה</button></div>" +
    "<div class='tabs'>" +
    "<button class='tab" + (current.tab==="summary"?" active":"") + "' data-tab='summary'>📖 סיכום</button>" +
    "<button class='tab" + (current.tab==="practice"?" active":"") + "' data-tab='practice'>✍️ תרגול (" + u.questions.length + ")</button>" +
    "</div><div id='unitBody'></div>";
  unitView.innerHTML = html;
  el("backBtn").addEventListener("click", function(){ renderHome(); });
  el("printBtn").addEventListener("click", function(){
    printDoc("יחידה " + u.id + " — " + u.title, "סיכום מלא + " + u.questions.length + " שאלות תרגול + דף תשובות", u.summary, u.questions, true);
  });
  unitView.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      current.tab = t.getAttribute("data-tab");
      renderUnit();
      window.scrollTo(0,0);
    });
  });
  if(current.tab === "summary") renderSummary();
  else renderPractice();
}

function renderSummary(){
  el("unitBody").innerHTML = "<div class='summary'>" + current.unit.summary + "</div>" +
    "<div style='text-align:center;margin:18px 0;'><button class='retry-btn' id='goPractice'>✍️ מעבר לתרגול היחידה</button></div>";
  el("goPractice").addEventListener("click", function(){
    current.tab = "practice"; renderUnit(); window.scrollTo(0,0);
  });
}

function renderPractice(){
  var u = current.unit;
  var answered = 0, correct = 0;
  var body = el("unitBody");
  body.innerHTML = "<div class='q-progress'><span id='pAnswered'>נענו 0 מתוך " + u.questions.length + "</span>" +
    "<span id='pScore'>✅ 0 נכונות</span></div><div id='qList'></div><div id='qResult'></div>";
  var list = el("qList");
  u.questions.forEach(function(q, qi){
    var card = document.createElement("div");
    card.className = "q-card";
    var badge = q.exam ? "<span class='q-exam-badge'>🎓 שאלת מבחן אמיתית</span>" : "";
    card.innerHTML = "<div class='q-num'>שאלה " + (qi+1) + badge + "</div>" +
      "<div class='q-text'></div><div class='q-opts'></div><div class='q-explain'></div>";
    card.querySelector(".q-text").textContent = q.q;
    var optsWrap = card.querySelector(".q-opts");
    var letters = ["א","ב","ג","ד","ה","ו"];
    q.options.forEach(function(op, oi){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = letters[oi] + ". " + op;
      b.addEventListener("click", function(){
        if(card.getAttribute("data-done")) return;
        card.setAttribute("data-done","1");
        answered++;
        var isRight = (oi === q.answer);
        if(isRight) correct++;
        optsWrap.querySelectorAll(".opt").forEach(function(bb, bi){
          bb.disabled = true;
          if(bi === q.answer) bb.classList.add("correct");
          else if(bi === oi && !isRight) bb.classList.add("wrong");
        });
        var exWrap = card.querySelector(".q-explain");
        var cls = isRight ? "ex-ok" : "ex-bad";
        var title = isRight ? "✅ נכון מאוד!" : "❌ לא מדויק. התשובה הנכונה: " + letters[q.answer] + ".";
        exWrap.innerHTML = "<div class='explain " + cls + "'><span class='ex-title'>" + title + "</span> <span class='ex-body'></span></div>";
        exWrap.querySelector(".ex-body").textContent = q.explain || "";
        el("pAnswered").textContent = "נענו " + answered + " מתוך " + u.questions.length;
        el("pScore").textContent = "✅ " + correct + " נכונות";
        if(answered === u.questions.length) finishPractice();
      });
      optsWrap.appendChild(b);
    });
    list.appendChild(card);
  });
  function finishPractice(){
    var pct = Math.round(correct / u.questions.length * 100);
    var best = parseInt(store("unit" + u.id + "_best") || "0", 10);
    if(pct > best) store("unit" + u.id + "_best", String(pct));
    var cls = pct >= 80 ? "result-pass" : "result-mid";
    var msg = pct >= 80 ? "כל הכבוד! שליטה מצוינת ביחידה 🎉" :
              pct >= 60 ? "לא רע! כדאי לחזור על הסיכום ולתרגל שוב 💪" :
              "מומלץ לקרוא שוב את הסיכום ולנסות מחדש 📖";
    el("qResult").innerHTML = "<div class='result-banner " + cls + "'>" +
      "סיימת את התרגול: " + correct + "/" + u.questions.length + " (" + pct + "%)<br>" + msg +
      "<br><button class='retry-btn' id='retryBtn'>🔄 תרגול מחדש</button></div>";
    el("retryBtn").addEventListener("click", function(){ renderPractice(); window.scrollTo(0,0); });
    el("qResult").scrollIntoView({behavior:"smooth"});
  }
}

/* ---------- מבחנים מסכמים ---------- */
function openExam(i){
  var ex = EXAMS[i];
  if(!ex) return;
  current = { exam: ex, examIndex: i };
  markNav("nav-e" + i);
  homeView.classList.add("hidden");
  unitView.classList.remove("hidden");
  renderExam();
  window.scrollTo(0,0);
}

function renderExam(){
  var ex = current.exam, idx = current.examIndex;
  var n = ex.questions.length;
  var answers = new Array(n).fill(-1);
  var submitted = false;
  var best = store("exam" + idx + "_best");
  var letters = ["א","ב","ג","ד","ה","ו"];

  var html = "<div class='unit-head'>" +
    "<button class='back-btn' id='backBtn'>→ חזרה</button>" +
    "<h2>🎓 " + ex.title + "</h2>" +
    "<button class='back-btn print-btn' id='printBtn'>🖨️ הדפסה</button></div>" +
    "<div class='exam-intro'><b>הוראות (כמו במבחן האמיתי):</b> בכל שאלה מוצגות מספר טענות — יש לסמן את התשובה הנכונה ביותר (אחת בלבד). " +
    "אין משוב מיידי: הציון, התשובות וההסברים יוצגו רק לאחר לחיצה על \"הגשת המבחן\". ניתן לשנות תשובה עד ההגשה." +
    (best ? " · 🏆 השיא שלך במבחן זה: " + best + "%" : "") + "</div>" +
    "<div class='exam-bar'><span id='exCount'>נענו 0 מתוך " + n + "</span>" +
    "<button class='submit-btn' id='submitBtn'>📤 הגשת המבחן</button></div>" +
    "<div id='qList'></div><div id='qResult'></div>";
  unitView.innerHTML = html;
  el("backBtn").addEventListener("click", function(){ renderHome(); });
  el("printBtn").addEventListener("click", function(){
    printDoc(ex.title, n + " שאלות בפורמט המבחן האמיתי · דף תשובות בעמוד האחרון", "", ex.questions, true);
  });

  var list = el("qList");
  ex.questions.forEach(function(q, qi){
    var card = document.createElement("div");
    card.className = "q-card";
    card.id = "exq" + qi;
    var badge = q.exam ? "<span class='q-exam-badge'>🎓 שאלת מבחן אמיתית</span>" : "";
    card.innerHTML = "<div class='q-num'>שאלה " + (qi+1) + badge + "</div>" +
      "<div class='q-text'></div><div class='q-opts'></div><div class='q-explain'></div>";
    card.querySelector(".q-text").textContent = q.q;
    var optsWrap = card.querySelector(".q-opts");
    q.options.forEach(function(op, oi){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = letters[oi] + ". " + op;
      b.addEventListener("click", function(){
        if(submitted) return;
        answers[qi] = oi;
        optsWrap.querySelectorAll(".opt").forEach(function(bb, bi){
          bb.classList.toggle("sel", bi === oi);
        });
        var c = answers.filter(function(a){ return a >= 0; }).length;
        el("exCount").textContent = "נענו " + c + " מתוך " + n;
      });
      optsWrap.appendChild(b);
    });
    list.appendChild(card);
  });

  el("submitBtn").addEventListener("click", function(){
    if(submitted) return;
    var missing = answers.filter(function(a){ return a < 0; }).length;
    if(missing > 0 && !window.confirm("נותרו " + missing + " שאלות ללא מענה. להגיש בכל זאת?")) return;
    submitted = true;
    el("submitBtn").disabled = true;
    var correct = 0;
    ex.questions.forEach(function(q, qi){
      var card = el("exq" + qi);
      var chosen = answers[qi];
      var isRight = (chosen === q.answer);
      if(isRight) correct++;
      card.querySelectorAll(".opt").forEach(function(bb, bi){
        bb.disabled = true;
        if(bi === q.answer) bb.classList.add("correct");
        else if(bi === chosen && !isRight) bb.classList.add("wrong");
      });
      var exWrap = card.querySelector(".q-explain");
      var cls = isRight ? "ex-ok" : "ex-bad";
      var title = isRight ? "✅ נכון!" : (chosen < 0 ? "⚠️ לא נענתה. התשובה הנכונה: " + letters[q.answer] + "." : "❌ שגוי. התשובה הנכונה: " + letters[q.answer] + ".");
      exWrap.innerHTML = "<div class='explain " + cls + "'><span class='ex-title'>" + title + "</span> <span class='ex-body'></span></div>";
      exWrap.querySelector(".ex-body").textContent = q.explain || "";
    });
    var pct = Math.round(correct / n * 100);
    var prevBest = parseInt(store("exam" + idx + "_best") || "0", 10);
    if(pct > prevBest) store("exam" + idx + "_best", String(pct));
    var cls = pct >= 80 ? "result-pass" : (pct >= 60 ? "result-mid" : "result-fail");
    var msg = pct >= 80 ? "מצוין! אתה מוכן למבחן 🎉" :
              pct >= 60 ? "עברת — אבל שווה לחזק את הנושאים שבהם טעית 💪" :
              "מתחת לציון עובר. חזרו לסיכומי היחידות הרלוונטיות ונסו שוב 📖";
    el("qResult").innerHTML = "<div class='result-banner " + cls + "'>" +
      "הציון שלך: " + correct + "/" + n + " — <b>" + pct + "</b><br>" + msg +
      "<br><button class='retry-btn' id='retryBtn'>🔄 ניסיון נוסף</button></div>";
    el("retryBtn").addEventListener("click", function(){ renderExam(); window.scrollTo(0,0); });
    el("qResult").scrollIntoView({behavior:"smooth"});
    window.scrollTo(0,0);
  });
}
})();

</script>
