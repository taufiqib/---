<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול מערכות מידע — מערכת לימוד ותרגול</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1c2333; --muted:#66708a;
  --brand:#1e5aa8; --brand2:#0e8f7a; --line:#e3e7ef;
  --ok:#0e8f5a; --okbg:#e8f7ef; --bad:#c23a3a; --badbg:#fdeeee;
  --gold:#b07d1e; --goldbg:#fdf6e6; --shadow:0 2px 10px rgba(20,30,60,.07);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --card:#1b202c; --ink:#e8ebf3; --muted:#9aa4bd;
    --brand:#6ea8ee; --brand2:#3fc2a7; --line:#2a3145;
    --ok:#4cc98a; --okbg:#12301f; --bad:#e07070; --badbg:#3a1c1c;
    --gold:#e0b45c; --goldbg:#332913; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Heebo",Arial,sans-serif;line-height:1.65;}
.hidden{display:none !important;}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;box-shadow:var(--shadow);}
.topbar-title{font-weight:700;font-size:1.05rem;}
.topbar-sub{font-weight:400;font-size:.8rem;opacity:.85;}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.2rem;border-radius:8px;padding:4px 10px;cursor:pointer;}

.layout{display:flex;min-height:calc(100vh - 120px);}
.sidenav{width:260px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);padding:14px 10px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:.93rem;margin-bottom:2px;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--brand);color:#fff;font-weight:700;}
.nav-item .nv-badge{margin-inline-start:auto;font-size:.72rem;color:var(--muted);}
.nav-item.active .nv-badge{color:#e8f0ff;}
.nav-home{font-weight:700;border-bottom:1px solid var(--line);margin-bottom:8px;padding-bottom:10px;}

.main{flex:1;padding:22px clamp(14px,3vw,40px);max-width:980px;margin:0 auto;}

.hero{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:26px 24px;box-shadow:var(--shadow);margin-bottom:22px;}
.hero h1{margin:0 0 6px;font-size:1.5rem;}
.hero p{margin:0;opacity:.92;font-size:.95rem;}
.hero .hero-stats{margin-top:12px;font-size:.85rem;opacity:.9;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;}
.ucard:hover{transform:translateY(-3px);}
.ucard .uc-icon{font-size:1.5rem;}
.ucard h3{margin:8px 0 4px;font-size:1rem;}
.ucard .uc-desc{color:var(--muted);font-size:.82rem;min-height:2.4em;}
.ucard .uc-meta{margin-top:10px;font-size:.78rem;color:var(--brand);font-weight:600;}
.ucard .uc-best{font-size:.75rem;color:var(--ok);font-weight:700;}

.unit-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.unit-head h2{margin:0;font-size:1.35rem;}
.back-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.85rem;}
.tabs{display:flex;gap:8px;margin:14px 0;}
.tab{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 18px;cursor:pointer;font-size:.88rem;color:var(--ink);}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}

.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);font-size:.95rem;}
.summary h3{color:var(--brand);margin:20px 0 8px;font-size:1.05rem;border-bottom:2px solid var(--line);padding-bottom:4px;}
.summary h3:first-child{margin-top:0;}
.summary h4{color:var(--brand2);margin:14px 0 6px;font-size:.95rem;}
.summary ul{margin:6px 0;padding-inline-start:20px;}
.summary li{margin-bottom:4px;}
.summary table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.87rem;}
.summary th{background:var(--brand);color:#fff;padding:7px 10px;text-align:right;}
.summary td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;}
.summary tr:nth-child(even) td{background:var(--bg);}
.hl{background:var(--goldbg);border-right:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.9rem;}
.hl b:first-child{color:var(--gold);}

.q-progress{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:.85rem;display:flex;justify-content:space-between;box-shadow:var(--shadow);}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.q-num{color:var(--brand);font-weight:800;font-size:.8rem;}
.q-exam-badge{display:inline-block;background:var(--goldbg);color:var(--gold);border:1px solid var(--gold);border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 10px;margin-inline-start:8px;vertical-align:middle;}
.q-text{font-weight:600;margin:8px 0 12px;white-space:pre-line;font-size:.95rem;}
.opt{display:block;width:100%;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.5;}
.opt:hover{border-color:var(--brand);}
.opt.correct{background:var(--okbg);border-color:var(--ok);font-weight:700;}
.opt.wrong{background:var(--badbg);border-color:var(--bad);}
.opt:disabled{cursor:default;opacity:1;}
.explain{background:var(--bg);border-right:4px solid var(--brand2);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.87rem;}
.explain .ex-title{font-weight:800;}
.ex-ok .ex-title{color:var(--ok);}
.ex-bad .ex-title{color:var(--bad);}

.result-banner{border-radius:14px;padding:18px 20px;margin:16px 0;text-align:center;font-size:1.05rem;font-weight:700;box-shadow:var(--shadow);}
.result-pass{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok);}
.result-mid{background:var(--goldbg);color:var(--gold);border:1.5px solid var(--gold);}
.retry-btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 22px;cursor:pointer;font-size:.9rem;margin-top:8px;font-family:inherit;}

.foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px;border-top:1px solid var(--line);background:var(--card);}
.foot-logo{height:44px;width:auto;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .foot-logo{background:#f4f4f2;border-radius:10px;padding:4px 8px;}
}
.foot-text{font-size:.8rem;color:var(--muted);}

@media (max-width:860px){
  .menu-btn{display:block;}
  .topbar-sub{display:none;}
  .topbar{gap:8px;padding:10px 12px;}
  .topbar-title{font-size:.98rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidenav{position:fixed;right:0;left:auto;top:0;bottom:0;z-index:100;width:min(280px,82vw);
    transform:translateX(100%);transition:transform .22s ease;
    padding-top:calc(64px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 0 30px rgba(0,0,0,.35);}
  .sidenav.open{transform:translateX(0);}
  .nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;opacity:0;pointer-events:none;transition:opacity .22s;}
  .nav-backdrop.show{opacity:1;pointer-events:auto;}
  .layout{display:block;}
  .main{padding:14px 12px;}
  .exam-bar{top:calc(52px + env(safe-area-inset-top,0px));}
}


:root[data-theme="dark"]{
  --bg:#12151d; --card:#1b202c; --ink:#e8ebf3; --muted:#9aa4bd;
  --brand:#6ea8ee; --brand2:#3fc2a7; --line:#2a3145;
  --ok:#4cc98a; --okbg:#12301f; --bad:#e07070; --badbg:#3a1c1c;
  --gold:#e0b45c; --goldbg:#332913; --shadow:0 2px 10px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .foot-logo{background:#f4f4f2;border-radius:10px;padding:4px 8px;}
.theme-btn{margin-inline-start:auto;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:.85rem;border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.theme-btn:hover{background:rgba(255,255,255,.25);}
.opt.sel{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 2px var(--brand) inset;font-weight:700;}
.exam-bar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow);flex-wrap:wrap;}
.submit-btn{background:var(--brand2);color:#fff;border:none;border-radius:10px;padding:9px 22px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit;}
.submit-btn:disabled{opacity:.55;cursor:default;}
.nav-sep{margin:10px 4px 6px;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.03em;}
.exam-intro{background:var(--goldbg);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.88rem;}
.result-fail{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad);}

.print-btn{margin-inline-start:auto;}
.unit-head{flex-wrap:wrap;}

</style>
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="menu-btn" aria-label="תפריט">☰</button>
  <div class="topbar-title">💾 ניהול מערכות מידע <span class="topbar-sub">· ד"ר שי צבאן · המרכז האקדמי פרס</span></div>
  <button id="themeBtn" class="theme-btn" aria-label="החלפת מצב תצוגה">🌓 תצוגה</button>
</header>

<div class="layout">
  <div id="navBackdrop" class="nav-backdrop"></div>
  <nav id="sideNav" class="sidenav"><div id="navList"></div></nav>
  <main id="main" class="main">
    <section id="homeView"></section>
    <section id="unitView" class="hidden"></section>
  </main>
</div>

summary: `
<h3>מהי מערכת מידע — ההגדרה המלאה</h3>
<p>ההגדרה "היבשה": מערכות מידע הן לכאורה <b>תוכנות ומחשבים</b>. אבל ההגדרה המלאה: <b>שילובים של תוכנות ומחשבים שעוזרים לייצר ערך לארגונים</b> — וזאת הודות לארבע יכולות: <b>איסוף</b> המידע, <b>עיבודו</b> וניתוחו, והיכולת <b>לשלוף ולהציג</b> אותו בצורה מתאימה. מערכת המידע היא <b>המנוע שמאחורי כל תהליך עסקי</b> — היא הופכת מידע לערך מוחשי, ועל בסיסה מתקבלות ההחלטות בארגון.</p>
<div class="hl"><b>משפט מפתח מהתמלול:</b> "העולם היום מוצף לגמרי במידע. בלי מערכות מידע, העומס יהפוך להצפה" — מטרת המערכות היא לצקת למידע <b>אפקטיביות ניהולית</b> (ערך מועיל, השפעה חיובית). כמות מידע גדולה כשלעצמה אינה יתרון — רק עיבוד נכון הופך אותה לערך.</div>
<h4>דוגמאות לשימושי מידע עסקיים (מהשיעור)</h4>
<ul>
<li><b>מתן אשראי</b> — חברת "הודיה" בע"מ מבקשת הלוואה מהבנק. הבנק זקוק למידע: הכנסות, הוצאות, התחייבויות קיימות ונתונים כספיים — כדי להחליט אם לאשר, אם הלווה יחזיר, ואיזו ריבית לקבוע.</li>
<li><b>גיוס עובדים</b> — פרסום הדרישה, קליטת המידע ועיבודו הנכון לגיוס יעיל ואפקטיבי.</li>
<li><b>התייעלות</b> — קבלת ועיבוד מידע על תהליכי ייצור ושירות כדי לזהות היכן לשפר ולקצץ.</li>
<li><b>תמחור</b> — מידע כספי לקביעת עלויות מוצרים וחישוב מחירי מכירה.</li>
<li><b>דוגמת One Zero</b> — בנק שמבסס את כל הצעת הערך על ייעוץ והמלצות בכלי בינה מלאכותית: לוקח המון מידע מהתנהלות החשבון והופך אותו להמלצות מעשיות — חוויית לקוח משופרת + יתרון תחרותי לבנק.</li>
</ul>
<h3>שלוש קטגוריות העל — התרשים מהשיעור</h3>
<table>
<tr><th>שלב</th><th>מה קורה</th><th>המערכת</th></tr>
<tr><td>(1) עסקאות, אירועים, מידע בסיסי</td><td>רישום, תיעוד, לדאוג שיהיה זמין ונגיש</td><td><b>TPS — Transaction Processing System</b> — מערכת עיבוד תנועות: אוספת, שומרת, משנה ומשחזרת נתונים. הבסיס של הבסיס — כמחסן גדול של נתונים. החלפה ותיעוד ישיר של אינפורמציה בין צדדים (לקוח↔חברה).</td></tr>
<tr><td>(2) הפקת דיווחים מרוכזים למטרות ניהול שוטף</td><td>נשענות על המידע ממערכות TPS ומסייעות למנהלי ביניים</td><td><b>MIS — Management Information System</b> — מערכת מידע ניהולית: משלבת מידע, כלים טכנולוגיים והבנה של תהליכים ארגוניים ליצירת מידע שיעזור למנהלים בקבלת <b>החלטות שוטפות</b>.</td></tr>
<tr><td>(3) הצגת מידע משולב לצורך החלטות אסטרטגיות</td><td>נשענות על מידע מהארגון עצמו (TPS/MIS) <b>וגם מחוץ לארגון</b></td><td><b>ESS — Executive Support System</b> — מערכת תומכת הנהלה בכירה: החלטות אסטרטגיות, משמעותיות לטווח ארוך; משלבת מידע פנימי וחיצוני.</td></tr>
</table>
<h3>ההבדלים בין המערכות — לב היחידה</h3>
<ul>
<li><b>TPS מול MIS:</b> ה-TPS מתמקדת ב<b>דיוק וביעילות של איסוף הנתונים</b>; ה-MIS מתמקדת ב<b>מתן אינפורמציה לצורכי קבלת החלטות</b>. ה-MIS מגשרת על הפער בין המידע הגולמי שנוצר ב-TPS לבין ההחלטה הניהולית.</li>
<li><b>MIS מול ESS:</b> ה-MIS מסייעת ל<b>החלטות שוטפות</b> ומבוססת על <b>נתונים פנימיים</b>; ה-ESS מסייעת ל<b>החלטות אסטרטגיות</b> ומוסיפה <b>נתונים חיצוניים</b> — נתוני שוק ומתחרים. ה-ESS מורכבת וגמישה יותר, כי החלטות אסטרטגיות מורכבות יותר.</li>
<li><b>שילוב פנים + חוץ = יתרון תחרותי:</b> שילוב חכם של נתונים פנים-ארגוניים וחוץ-ארגוניים מספק ראייה רחבה ושלמה (הוליסטית) של ביצועי החברה והתנהגות השווקים — וזה מה שיוצר לחברה יתרון תחרותי.</li>
</ul>
<h4>דוגמאות ממחישות מהשיעור</h4>
<ul>
<li><b>שירותי סטרימינג מוזיקליים (Spotify / Apple Music):</b> המידע הגולמי — ההאזנות שלנו; העיבוד מתבצע ב-<b>Backend</b> ("מאחורי הקלעים" של המערכת); התוצר הניהולי — המלצות והתאמות. זו הדגמה של <b>MIS</b>: עיבוד נתונים פנימיים להחלטות שוטפות.</li>
<li><b>חנות אפליקציות (AppStore):</b> בעת הורדת אפליקציה המערכת מתעדת את הפעולה, מנהלת את התשלום ומוודאת ביצוע תקין — הדגמה קלאסית של <b>TPS</b>.</li>
<li><b>שלוש היכולות של ESS שהוצגו:</b> (1) ניתוח נתונים מורכבים — נתח שוק וביצועים (2) הבנת מגמות ותחזיות לעתיד — לא רק מה שקרה אלא מה שצפוי (3) הצפת נתונים מרכזיים הדורשים התעמקות של הדרג הבכיר.</li>
</ul>
<h3>טבלת מושגי היחידה</h3>

<h3>הגדרה ומהות</h3>
<p><b>TPS — Transaction Processing System</b> — מערכת ממוחשבת חיונית שמטרתה <b>לנהל ולעבד מידע על עסקאות ונתונים ברמה השוטפת והיום-יומית</b> של הפעילות העסקית. זוהי מערכת התשתית הבסיסית ביותר ליצירת המידע בחברה: היא מחברת בין עסקאות ספציפיות לבסיס נתונים שמאפשר תיעוד ושליפת נתונים מפורטים לגבי כל עסקה, לרבות <b>בקרת תקינותם</b>, שימוש בהם למעקב אחר העסקאות — <b>ויצירת תשתית הנתונים למערכות הנוספות (MIS ו-ESS)</b>.</p>

<h4>מושג יסוד: עסקה / תנועה</h4>
<p><b>עסקה (תנועה)</b> = פעולה עסקית בודדת שנקלטת, מתועדת, מחויבת כספית ומלווה מתחילתה ועד סופה. לכל עסקה נשמר תיעוד מלא: פרטי העסקה, <b>זמני שילוח, שביעות רצון הלקוח והיסטוריית הזמנות</b> — מידע שמשרת גם את הלקוח (מעקב, שירות) וגם את הארגון (בקרה, ניתוח עתידי).</p>

<p><b>CRM — Customer Relationship Management</b> — נוצרה מתוך התפיסה ש<b>הלקוח הוא הנכס החשוב ביותר לארגון</b>: איסוף שיטתי של המידע על ההתקשרויות והממשקים עם הלקוח, ומתן נגישות אליו, משפרים את השירות ומספקים תובנות רבות ערך במישור התחרותי. זו <b>גישה</b> ניהולית — לא רק תוכנה: <b>גישת "360 מעלות סביב הלקוח"</b> — ניהול מרוכז ויעיל של כל האינטראקציות מול הלקוחות, מתוך תפיסה שהלקוח הוא הנכס המרכזי. מערכות ראשונות הופיעו כבר בשנות ה-50; המערכות המודרניות — מאמצע שנות ה-90. יצרניות מוכרות: <b>Oracle, Salesforce, Microsoft</b> ורבות נוספות (אף חברה אינה "היחידה").</p>
<div class="hl"><b>ההגדרה הטכנית (לצטט במבחן):</b> שילוב כל הפרקטיקות, האסטרטגיות והטכנולוגיות לניהול וניתוח מידע מתהליך ההתקשרות עם הלקוח <b>לאורך כל מחזור חייו</b>.<br><b>שלוש מטרות הליבה:</b> (1) גיוס לקוחות חדשים (2) שימור לקוחות קיימים (3) הגדלת מחזור העסקים, המכירות וההכנסות. <b>ההיגיון הכלכלי:</b> עלות גיוס לקוח חדש גבוהה מעלות שימור לקוח קיים — ולכן השימור הוא גם שיקול כלכלי, לא רק שירותי.</div>
<p><b>ערוצי התקשרות</b> — היבט מרכזי: המערכת שואבת נתונים מ<b>מגוון רחב של ערוצים</b> — נקודות הממשק בין הלקוח לחברה: אתר, טלפון, מייל, וואטסאפ, צ'אטים, פניות שיווקיות ורשתות חברתיות. מה שמבדיל CRM מודרנית מתיעוד פשוט: <b>אינטגרציה</b> של כל הערוצים לתמונת לקוח אחת.</p>
<h3>היתרונות והשימושים — הרשימה המלאה</h3>
<ul>
<li><b>טרגוט (Targeting)</b> — קביעת קהל היעד הרלוונטי לפי מאפייני לקוחות (גיל, מיקום, הרגלי צריכה) לשיווק יעיל. <u>לא</u> יעד תקציבי ולא יעד הכנסות!</li>
<li><b>עלייה בהכנסות</b> — הבנה מה להדגיש, איך תמחור משפיע; <b>תוכניות נאמנות ומועדוני לקוחות</b> — כלי מבוסס מידע שמחזק את הקשר למותג ותורם לשימור.</li>
<li><b>סגירת עסקאות</b> — זיהוי <b>"ליד" (Lead)</b> = לקוח פוטנציאלי; <b>"ליד חם / לקוח חם"</b> = לקוח במצב <b>מוכנות לקנייה</b> (לא לפי שעת קבלת הנתונים!). זיהויו מאפשר מענה מהיר שמגדיל את הסתברות המכירה.</li>
<li><b>Up-Sell ומסע לקוח</b> — הצעת מוצרים נוספים רלוונטיים על בסיס ניתוח דפוסי קנייה (דוגמת השיעור: רכשת iPhone? הצעת מטען אלחוטי בהנחה). גם כשההצעה נכשלת — המערכת לומדת מכך ומשפרת את הבנת <b>מסע הלקוח</b> (תהליך הקנייה שלו לאורך זמן).</li>
<li><b>הימנעות מ"הטרדה"</b> — לא מציעים מוצר שכבר נרכש; מונעים פניות סרק וספאם.</li>
<li><b>פישוט תהליכים</b> — מענה קולי, צ'טבוטים, ניתוב וזיהוי אוטומטי של הפונה.</li>
<li><b>נגישות ופידבק · טיפול דיפרנציאלי</b> — הנציג רואה את כל ההיסטוריה, <b>ההעדפות</b> והמידע האישי ← שירות מותאם ללקוח הספציפי.</li>
<li><b>אופטימיזציה של השיווק</b> — הבנה עמוקה של צרכים והתנהגות ← שיווק בזמן הנכון ולקהל הנכון.</li>
<li><b>נאמנות לקוחות</b> — לקוחות מרוצים ← נאמנים ← ממליצים; המערכת מזהה ממליצים ומאפשרת לתגמל אותם.</li>
<li><b>שיפור התקשורת הפנימית</b> — למשל העברת פרטי מתעניינים ממחלקת שיווק למחלקת מכירות ביעילות.</li>
</ul>
<h4>שמונת היתרונות המסכמים (רשימת הסגירה של השיעור)</h4>
<p>(1) קשר טוב יותר עם הלקוחות (2) הבנה טובה יותר של צורכיהם (3) שיתוף פעולה פנימי טוב יותר (4) שיפור יעילות מתן השירות (5) שיפור שביעות רצון <b>העובדים</b> (6) הגדלת הכנסות (7) חיסכון בעלויות (8) הקטנת היקפי נטישת לקוחות.</p>
<h3>שלושת הרכיבים הקריטיים ("שלוש הזרועות")</h3>
<div class="hl"><b>שלוש הזרועות העקרוניות של CRM (ניסוח המבחן):</b> שירות שוטף · ניתוח מידע <b>מתקדם</b> · אוטומציה.</div>
<table>
<tr><th>רכיב</th><th>תפקיד מלא</th></tr>
<tr><td><b>רכיב שירות הלקוחות<br>(Front Office)</b></td><td>הצוות, התהליכים ונקודות הממשק מול הלקוח: מכירה, תקשורת שיווקית, ו-<b>After Sales Service</b> — פעילות לאחר המכירה (שדרוגים, טיפול בתלונות ובקשות). מתרכז במידע שנוצר בנקודת הממשק לקוח↔ארגון ומתעד כל אינטראקציה.</td></tr>
<tr><td><b>רכיב אוטומציית מכירה</b></td><td>הגדרה אוטומטית של הפעולות להשלמת עסקת מכירה — לביצוע מהיר ויעיל; <b>זיהוי נקודת נטישת הרכישה</b>; מניעת כפילות ומאמץ מיותר לצוותי המכירות; נגישות ישירה למידע על דפוסי המכירות (גם לעובדים מחוץ לצוות). <u>לא</u> הזמנה אוטומטית מספקים (זה ERP) ו<u>לא</u> תיעוד שיחות (זה שירות לקוחות).</td></tr>
<tr><td><b>רכיב ניהול קמפיינים</b></td><td>הגדרה וניהול של מסעות פרסום המשלבים מגוון אלמנטים: פרסום באמצעי מדיה שונים, מבצעים, השקות מוצרים — יעילים יותר, עם הערכת הצלחה או כישלון.</td></tr>
</table>
<h3>מדדים: שביעות רצון ונאמנות</h3>
<ul>
<li><b>צורכי לקוחות (Customer Needs)</b> — לארגון מודרני <b>אסור להניח</b> מה הלקוח צריך; יש להתבסס על נתונים והסקת מסקנות.</li>
<li><b>תגובות הארגון (Customer Responses)</b> — המענה לצרכים ולבקשות, התלוי בהבנה ופרשנות נכונה.</li>
<li><b>שביעות רצון = מידת החפיפה בין צורכי הלקוחות לבין תגובות הארגון</b> — מחולל בידול ומיתוג בסביבה תחרותית. נדרשים <b>שני</b> הנתונים — אי אפשר למדוד מהצרכים בלבד.</li>
<li><b>נאמנות</b> — נטיית הלקוח להמשיך ולרכוש; נמדדת במשוב, עסקאות, ביקורים באתר והמלצות ← המערכת מאפשרת <b>פעולות מתקנות</b>.</li>
</ul>
<h3>ארבעת שלבי התפעול (הרצף חשוב!)</h3>
<table>
<tr><th>שלב</th><th>תפקיד</th></tr>
<tr><td><b>1. Analytical</b></td><td>איסוף וניתוח מידע לגבי הלקוחות, לפי סוגי המידע שהארגון מגדיר כמשמעותיים — בכלים טכנולוגיים: <b>Data Mining (כריית נתונים)</b> ממאגרים גדולים ו<b>בינה מלאכותית</b>. זיהוי מגמות והפקת תוצרי דיווח.</td></tr>
<tr><td><b>2. Operational</b></td><td><b>תרגום ממצאי הניתוח לצעדים פרקטיים:</b> קטגוריות לקוחות, המלצות פעילות, תעדוף משימות ופרויקטים.</td></tr>
<tr><td><b>3. Communicational</b></td><td>בחירה ותיאום של <b>ערוצי ההתקשרות</b> מול הלקוח (אחרי מייל — טלפון?) — ייעול ההתקשרויות ומניעת פניות סרק וספאם.</td></tr>
<tr><td><b>4. Collaborative</b></td><td><b>שיתוף אחיד של המידע בין מחלקות</b> הארגון, המאפשר להנהלה לקבוע יעדים ותוצרים לכל מחלקה. עבודה שיתופית.</td></tr>
</table>
<div class="hl"><b>מלכודות ההחלפה במבחן:</b> "אנליטית שמתרגמת לצעדים פרקטיים" = שגוי (זה Operational) · "Communicational שאוספת ומנתחת בכריית נתונים" = שגוי (זה Analytical) · "Communicational שמשתפת מידע בין מחלקות לקביעת יעדים" = שגוי (זה Collaborative).</div>
<div class="hl"><b>🎯 דגשים למבחן:</b> (1) האוטומציה <b>לא שוללת</b> ניהול ידני או בקרה אנושית. (2) המערכת לבדה לא משפרת שביעות רצון — נדרשים <b>שני תנאים מצטברים</b>: מסגרת נהלים ארגונית + <b>DNA ארגוני ותרבות תומכת CRM</b>. (3) CRM ממוקדת בתהליכי <b>הלקוחות</b> — לא בכלל המידע הארגוני (שכר, מלאי, כוח אדם = ERP). (4) המערכת חושפת גם העדפות קנייה — לא רק היסטוריה. (5) יש לה ערך גם לגיוס חדשים וגם להכנסות. (6) Intel לא מייצרת CRM.</div>

{q:"מהו התפקיד המרכזי והפוקוס של מערכות CRM אנליטיות – Analytical CRM?", options:["שיפור היעילות התפעולית בביצוע ההתקשרות עם הלקוח","איסוף וניתוח מידע לגבי הלקוחות בהתאם לסוגי המידע שמגדיר הארגון כבעלי משמעות","שיתוף הלקוחות בקבלת ההחלטות בדבר פיתוח מוצרים חדשים","ביצוע דיוור (משלוח מיילים והודעות) ללקוחות"], answer:1, explain:"Analytical = שלב איסוף וניתוח המידע לזיהוי מגמות והפקת תוצרי דיווח."},
{q:"מבין הטכנולוגיות הבאות, מי משרתת את המטרה של מערכות CRM אנליטיות (Analytical CRM)?", options:["כריית נתונים","מערכת TPS","ישיבות סטטוס לגבי הלקוחות, על בסיס שבועי","כל יתר התשובות שגויות"], answer:0, explain:"Data Mining — כריית נתונים ממאגרים גדולים — היא טכנולוגיה מרכזית בשלב האנליטי (לצד AI)."},
{q:"מערכות CRM תפעוליות (Operational CRM) מסוגלות –", options:["לייצר מוצרים ושירותים חדשים על בסיס כלי בינה מלאכותית","להתבסס על מידע ממערכות CRM אנליטיות כדי לתרגם את הממצאים לפעולות פרקטיות","לשפר את מערך ההתקשרות מול הספקים על מנת להוזיל עלויות ולהגדיל רווחים","כל התשובות נכונות"], answer:1, explain:"Operational = תרגום ממצאי ה-Analytical לצעדים אופרטיביים: קטגוריות לקוחות, המלצות ותעדוף."},
{q:"בהקשר למטרה של מערכות CRM מסוג Communicational CRM, הרי שניתן להגדירה על פי הנלמד כ –", options:["מערכת שמסייעת לשיפור היעילות התפעולית בחברה","מערכת המאפשרת ניתוח מידע מכל סוג שהוא","מערכת המאפשרת ייעול ההתקשרויות עם הלקוחות","מערכת המאפשרת קבלת החלטות דמוקרטית בארגון"], answer:2, explain:"Communicational = בחירה ותיאום של ערוצי ההתקשרות מול הלקוח (למשל: אחרי מייל — טלפון), למניעת פניות סרק."},
{q:"מבין הבאות, מה מהווה מטרה עיקרית של מערכת ניהול קשרי לקוחות בהקשר העסקי?", options:["גיבוי נתונים על גבי רשת האינטרנט","ניהול נתונים פיננסיים","הגדלת שביעות רצון הלקוחות ויצירת צמיחה עסקית","תמיכה בהחלטות אסטרטגיות"], answer:2, explain:"מטרות CRM: שביעות רצון, שימור, גיוס וצמיחה עסקית. החלטות אסטרטגיות = ESS."},
{q:"כיצד מערכת CRM יכולה לתרום להקטנת תחושת ה\"הטרדה\" שחווים לקוחות?", options:["על ידי התקשרות לבבית עם תסריט שיחה חיובי","על ידי הימנעות מהצעת מוצרים שלא רלוונטיים ללקוח","על ידי בקשה מהלקוח לרכוש שוב, תוך כדי התנצלות מתאימה","על בסיס שימוש במידע פיננסי בלבד"], answer:1, explain:"המערכת יודעת להימנע מהצעות מיותרות ומציקות — למשל הצעה חוזרת של מוצר שכבר נרכש."},
{q:"איזה סוג של כלי צוין על ידינו שמשרת מערכות Analytical CRM?", options:["כלי בינה מלאכותית — Artificial Intelligence","הזנת מידע ידנית","מערכת Communicational CRM","מערכת Collaborative CRM"], answer:0, explain:"בשלב האנליטי משתמשים בכריית נתונים ובכלי בינה מלאכותית לזיהוי מגמות."},
{q:"כיצד מערכות CRM תורמות להגדלת נאמנות הלקוחות?", options:["על בסיס הצעה חוזרת ונשנית של מוצרים ושירותים","על בסיס מדידת פרמטרים לשביעות רצון הלקוחות, נאמנות הלקוחות ונקיטה בפעולות מתקנות","על בסיס שימוש במידע היסטורי מתוך מערכות החברה בלבד","כל יתר הטענות שגויות"], answer:1, explain:"המערכת מודדת שביעות רצון ונאמנות (משוב, עסקאות, ביקורים, המלצות) ומאפשרת פעולות מתקנות ותגמול ממליצים."},
{q:"מהו הדגש המרכזי של מערכת Collaborative CRM?", options:["שמירה על חסיון המידע הארגוני","שמירה על יכולת עבודה אוטונומית ועצמאית של כל אחד מעובדי הארגון","שיתוף מידע ועבודה שיתופית","כל התשובות נכונות"], answer:2, explain:"Collaborative = שיתוף אחיד של המידע בין מחלקות הארגון, המאפשר להנהלה לקבוע יעדים לכל מחלקה."},
{q:"מהי החשיבות בהתפתחויות טכנולוגיות בעולם ה-CRM?", options:["צמצום במספר המשרות","יצירת תשתית למתן שירות מהיר ויעיל יותר","הקטנת התקשורת בין מחלקות בחברה","כל התשובות נכונות"], answer:1, explain:"טכנולוגיות כמו ענן, אינטגרציה, רשתות חברתיות ו-AI משתלבות ב-CRM ומאפשרות שירות מהיר ויעיל יותר."},
{q:"לפניכם מספר טענות לגבי מערכות שונות:\nטענה 1: מהות מערכת CRM היא לשקף גישה לניהול כל הפעולות בארגון, כולל שכר עבודה, ניהול מלאי, קשרי לקוחות וכל הנושאים המרכזיים המטופלים במסגרת הארגון\nטענה 2: חברת Oracle מייצרת רק מערכות CRM ואילו חברת Salesforce מייצרת רק מערכות ERP\nטענה 3: גישת CRM ברמה הניהולית משמעה: יש לנהל את המלאי בצורה היעילה ביותר, גם אם המשמעות היא הארכת פרק הזמן למשלוח הסחורה ללקוחות", options:["טענה 1 בלבד","טענה 3 בלבד","כל הטענות שגויות","טענות 1 ו-2","טענות 2 ו-3"], answer:2, exam:true, explain:"טענה 1 מתארת ERP (כל הפעולות בארגון, שכר, מלאי) ולא CRM. טענה 2 שגויה — שתי החברות מייצרות מגוון מערכות, ו-Salesforce מזוהה דווקא עם CRM. טענה 3 שגויה — CRM שמה את הלקוח במרכז; הארכת זמן משלוח פוגעת בלקוח ומנוגדת לגישה."},
{q:"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: העקרונות הבסיסיים של מערכות CRM נשענים על 3 זרועות: שירות שוטף, ניתוח מידע מתקדם ואוטומציה\nטענה 2: מערכות CRM לבדן אינן יכולות לשפר את שביעות רצון הלקוחות, שכן נדרש מאמץ מצד החברה ברמה הארגונית והניהולית כדי להשיג מטרה זו\nטענה 3: מערכות CRM מאפשרות לשאוב נתונים ממגוון ערוצי התקשרויות", options:["טענה 1 בלבד","טענות 1 ו-3","כל הטענות נכונות","טענות 1 ו-2","טענה 3 בלבד"], answer:2, exam:true, explain:"שלוש הטענות נכונות: שלוש הזרועות (שירות שוטף, ניתוח מידע מתקדם ואוטומציה); המערכת היא כלי — ההצלחה דורשת גם מאמץ ארגוני-ניהולי; ושאיבת נתונים ממגוון ערוצים היא היבט מרכזי."},
{q:"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: מערכות CRM יכולות לסייע לחברה להעניק לצוותי שירות הלקוחות בחברה מידע מפורט בדבר היסטוריית הרכישה של הלקוחות בלבד – לא ניתן לגשת למידע הקשור להעדפות קניה ונושאים אחרים שנוצרים בהתקשרות איתם\nטענה 2: אחת מהתועלות האפשריות ביישום נכון של מערכות CRM היא סיוע בהגדלת שביעות רצון לקוחות, וזאת – בהקשר לשימור לקוחות קיימים. יחד עם זאת, למערכת אין ערך לגבי גיוס לקוחות חדשים\nטענה 3: טירגוט, בהקשר למערכות CRM ועל פי הנלמד, משמעו הגדלת יעד ההכנסות של החברה (למשל: \"החברה מבצעת טירגוט הכנסות בשווי של 1,000,000 ש\"ח וזה היעד שלנו\")", options:["טענה 1 בלבד","טענה 2 בלבד","טענה 3 בלבד","כל הטענות שגויות","טענות 1 ו-3"], answer:3, exam:true, explain:"טענה 1 שגויה — המערכת חושפת גם העדפות קנייה ומידע נוסף, לא רק היסטוריה. טענה 2 שגויה — גיוס לקוחות חדשים הוא אחת משלוש מטרות הליבה. טענה 3 שגויה — טרגוט = קביעת קהל היעד לשיווק, לא יעד הכנסות."},
{q:"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: המשמעות של ליד (Lead) היא \"הובלה\" במובן התחרותי של המונח: כלומר אם מערכת ה-CRM מזהה שביצועי החברה טובים ונוצר לה יתרון על גבי המתחרים, המערכת תאותת על כך שקיים לחברה ליד על פני המתחרים\nטענה 2: המושג \"לידים חמים\" משקף פרטי לקוח פוטנציאלי שנתוניו התקבלו בשעה האחרונה ולכן נחשב לליד \"חם\"\nטענה 3: רכיב שירות הלקוחות במערכות CRM נקרא גם Front Office אשר מתרכז במידע שנוצר בנקודת הממשק בין הלקוח לארגון, ועוסק בתיעוד תהליכי המכירה והשירות", options:["טענה 1 בלבד","טענה 3 בלבד","טענות 1 ו-2","טענה 2 בלבד","טענות 1 ו-3"], answer:1, exam:true, explain:"טענה 1 שגויה — ליד הוא לקוח פוטנציאלי, לא 'הובלה תחרותית'. טענה 2 שגויה — ליד חם = לקוח במצב מוכנות לקנייה, לא לפי שעת קבלת הנתונים. טענה 3 נכונה — Front Office מתרכז בנקודת הממשק לקוח↔ארגון ובתיעוד המכירה והשירות."},
{q:"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: המושג \"אוטומציית מכירה\" משמעה לבצע הזמנה אוטומטית של מוצרים מהספק כאשר מזהים שהדרישה למוצרים היא גבוהה מהרגיל\nטענה 2: מערכות CRM מסוגלות לתעד מגוון סוגי מידע הקשורים לפעולות שביצע הלקוח ברמה הטכנית במערכת, אך אינן יכולות לסייע בהבנה משמעותית יותר של מסע הלקוח\nטענה 3: רכיב ניהול קמפיינים במערכות CRM עוסק בניהול מסעות פרסום שמשלבים מגוון אלמנטים כגון פרסום באמצעי מדיה שונים, מבצעים, השקות מוצרים ועוד", options:["טענה 2 בלבד","טענה 1 בלבד","טענה 3 בלבד","טענות 1 ו-3","טענות 2 ו-3"], answer:2, exam:true, explain:"טענה 1 שגויה — הזמנה אוטומטית מספקים היא רכש ב-ERP; אוטומציית מכירה ב-CRM עוסקת בהשלמת עסקת המכירה מול הלקוח. טענה 2 שגויה — המערכת דווקא לומדת ומשפרת את הבנת מסע הלקוח. טענה 3 נכונה."},
{q:"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: שביעות רצון הלקוחות בחברה נאמדת על בסיס החפיפה בין צרכי הלקוחות לבין תגובות הארגון\nטענה 2: מערכות CRM כוללות יכולות שמסייעות להעברת פרטי מתעניינים ממחלקת שיווק למחלקת מכירות בצורה יעילה\nטענה 3: לא ניתן לאמוד (להעריך) מידע לגבי נאמנות הלקוחות על בסיס המידע שנוצר / מתועד במערכת CRM", options:["טענות 2 ו-3","טענות 1 ו-2","טענה 1 בלבד","טענה 2 בלבד","טענה 3 בלבד"], answer:1, exam:true, explain:"טענות 1 ו-2 נכונות: שביעות רצון = חפיפה בין צרכים לתגובות, והמערכת מייעלת העברת לידים בין מחלקות (שיתוף מידע פנימי). טענה 3 שגויה — נאמנות נמדדת על בסיס משוב, עסקאות, ביקורים והמלצות."},
{q:"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: מערכת תפעולית (Operational) יודעת לתרגם את הממצאים של המערכת האנליטית לצעדים פרקטיים, כגון המלצות לפעילות ותעדוף משימות ופרויקטים\nטענה 2: מערכת אנליטית (Analytical) היא כזו שיודעת לתרגם ממצאים של מערכות אחרות לצעדים פרקטיים כגון המלצות לפעילות ותעדוף משימות ופרויקטים\nטענה 3: מערכת תקשורת מול לקוח (Communicational) יודעת לאסוף ולנתח מידע לגבי הלקוחות באמצעים טכנולוגיים כגון איסוף נתונים ממאגרים גדולים, בינה מלאכותית וכלים טכניים אחרים", options:["טענות 1 ו-3","טענה 1 בלבד","טענות 2 ו-3","טענה 2 בלבד","כל הטענות שגויות"], answer:1, exam:true, explain:"טענה 1 נכונה — זו בדיוק הגדרת Operational. טענה 2 שגויה — התרגום לצעדים פרקטיים הוא Operational, לא Analytical. טענה 3 שגויה — איסוף וניתוח בכריית נתונים ו-AI זה Analytical, לא Communicational."},
{q:"לפניכם מספר טענות:\nטענה 1: המידע הנובע ממערכות CRM יכול לסייע בשיפור שביעות רצון הלקוחות, אך לא בהגדלת ההכנסות. שכן, המערכת רואה בלקוחות את הנכס החשוב ביותר לארגון ולכן אין לה קשר להכנסות ולרווחיות\nטענה 2: הטמעה נכונה של מערכת CRM עשויה להקטין תסכול מצד הלקוחות אך אין בה ערך לגבי שיפור נוחות ויעילות העבודה מנקודת ראות צוות נציגי השירות\nטענה 3: מערכת CRM ממוקדת בהגדרה בתהליכים ובמידע הנוצר בתהליכים מול הלקוחות, ולא בכלל המידע הארגוני", options:["טענה 1 בלבד","טענה 3 בלבד","טענה 2 בלבד","טענות 2 ו-3","כל הטענות שגויות"], answer:1, exam:true, explain:"טענה 1 שגויה — הגדלת הכנסות היא מטרת ליבה מפורשת של CRM. טענה 2 שגויה — המערכת משפרת גם את שביעות רצון העובדים ונוחות עבודת הנציגים. טענה 3 נכונה — CRM ממוקדת בתהליכי הלקוחות; כלל המידע הארגוני = ERP."},

summary: `
<h3>הקונספט — "יומרני מאוד"</h3>
<p><b>ERP — Enterprise Resource Planning</b> — מערכת לתכנון משאבי הארגון, שתכליתה לרכז את <b>שרשרת תהליכי הליבה הארגוניים</b> והמידע הנובע מהם <b>תחת קורת גג אחת</b>: מערכת אחת שמקיפה את כל התהליך הארגוני והניהולי — הליכי <b>ייזום פרויקט, אישור תקציבי, ניהול מלאי, הקצאת עובדים, טיפול בשכר</b>, התחשבנויות ועוד. הקונספט יומרני מאוד — ולכן <b>הטמעות כושלות עלו לחברות עשרות מיליוני דולרים</b> והשפיעו לרעה על פעילותן.</p>
<h4>שני הממדים המגדירים</h4>
<table>
<tr><th>ממד</th><th>משמעות</th></tr>
<tr><td><b>אוטומציה של תהליכים עסקיים</b></td><td>ביצוע אוטומטי, מהיר ויעיל של תהליכים: מלאי, התחשבנויות, שכר וכוח אדם.</td></tr>
<tr><td><b>אינטגרציה — הרכיב הקריטי!</b></td><td>שילוב בין התהליכים העסקיים כך שיעבדו יחד, ומחלקות יוכלו לחלוק מידע. בלי אינטגרציה — "איים" אוטומטיים מנותקים ללא ערך ארגוני. התוצר המרכזי של אוטומציה + אינטגרציה: <b>למידה ארגונית משופרת</b> — שיפור איסוף המידע והנגישות אליו.</td></tr>
</table>
<h3>שבעת היתרונות — בפירוט מלא</h3>
<ul>
<li><b>(1) שליטה וניהול טובים יותר של מלאים</b> — תיעוד תמידי של הפריטים במחסן ובאתרים: חלקים ורכיבים, חומרי גלם וציוד. מונע <b>מכירות אבודות</b> (הפסד מחוסרים במלאי), פריטים <b>פגי תוקף</b> ועלויות <b>אחזקת מלאי עודף</b>. משמעותי במיוחד בחברות ייצור ושירות — שם ניהול המלאי קובע רווחיות.</li>
<li><b>(2) הקטנת זמן הטיפול בפעילות מנהלית שוטפת</b> — הנתון מוזן פעם אחת וזמין לכולם: צמצום הקלדה ידנית, תיקונים, העתקות והעברות לא מסודרות של נתונים.</li>
<li><b>(3) ניהול נכון יותר של ההוצאות</b> — <b>זיהוי הזדמנויות רכישה</b>, ריכוז רכש וניצול הנחות.</li>
<li><b>(4) קיצור זמן האספקה</b> — התייעלות התהליך משפרת גם את חוויית הלקוח.</li>
<li><b>(5) ניהול יעיל יותר</b> — זיהוי <b>מחוללי עלות</b> (הגורמים המובילים לעלויות) מתוך הנתונים הפיננסיים במערכת.</li>
<li><b>(6) הגדרה טובה יותר של תחומי אחריות</b> — קביעה ברורה של אחריות וממונה לכל שלב בתהליך, בזכות הנגישות לכל המידע. (זיהוי מבחן: "תחומי אחריות" = ERP, לא CRM!)</li>
<li><b>(7) שיפור היתרון התחרותי (עקיף)</b> — סך ההתייעלויות מתורגם למחיר, שירות ואמינות.</li>
</ul>
<h3>אתגרים ושאלות יישום</h3>
<div class="hl"><b>האתגר המרכזי אינו טכני:</b> לפני התקנת המערכת נדרש <b>ארגון מחדש של התהליכים העסקיים</b> — הגדרת התהליכים, איתור כפילויות ושיפורם. לעיתים לוקח זמן רב לזהות את התהליכים נכונה ולהבנותם היטב במערכת. <b>והכלל:</b> כשתוכנת הספק אינה חופפת לתהליכי הארגון — <b>מתאימים את המערכת לתהליך, ולא את התהליך למערכת</b>. פעולה הפוכה משבשת את הפעילות העסקית שמכניסה את הכסף.</div>
<ul>
<li><b>אתגרים נוספים:</b> עלות גבוהה ומורכבות; אתגר באפיון נכון שתומך בתהליכים המרכזיים; סיכון להטמעה כושלת שתפגע בפעילות. (במבחן: "כל התשובות נכונות" בשאלת האתגרים.)</li>
<li><b>TCO — Total Cost of Ownership (עלות בעלות כוללת):</b> עלות התוכנה, הרישיון והתחזוקה היא <b>רק חלק קטן</b>. יש להוסיף: עלויות <b>אפיון</b>, עלויות <b>בחירת</b> המערכת, <b>הכשרת עובדים</b>, <b>תקלות הטמעה</b> ותקופת <b>למידה</b> (ירידת פרודוקטיביות זמנית). לכן "השאלה הכי חשובה היא דמי הרכישה/השימוש" = טענה שגויה.</li>
<li><b>ROI — Return on Investment (תשואה להשקעה):</b> הערך הפיננסי מהמערכת. הגורם שקובע אותו במידה המשמעותית ביותר: <b>פרק הזמן הכולל עד להנבת התועלת</b> מההתייעלות — בין <b>שנה לעשר שנים</b>. התועלת הקלה יחסית למדידה: <b>צמצום מלאי</b>; הקשה לכימות: <b>פרודוקטיביות העובדים</b>. וכן: <b>הזמנות חירום</b> (הנובעות מטעויות וחוסרים) יקרות בהרבה מהזמנות הנובעות מניהול אחראי — והמערכת מצמצמת אותן.</li>
<li><b>תוכנת מדף מול מודולים:</b> תוכנת מדף = מערכת ERP כללית לא מותאמת, הכוללת את התהליכים המרכזיים ברוב החברות; לחלופין — מערכת "נתפרת" מ<b>מודולים</b> (רכיבים ספציפיים) לבקשת הארגון.</li>
<li><b>אופני יישום:</b> מקומי (On-Premise) / <b>ענן (Cloud)</b> — נגישות דרך האינטרנט במקום התקנה על מחשבי הארגון / משולב.</li>
<li><b>יצרניות מוכרות:</b> SAP, Oracle, Microsoft Dynamics, Sage, SYSPRO, NetSuite.</li>
</ul>

<tr><td><b>ניהול הוצאות</b></td><td>אוטומציה של תהליכי הרכישה וניהולן המדויק דרך המערכת; יישום מדרג הסמכויות ובקרת חריגות תקציב.</td></tr>

<h3>מעבד ה-M1 של Apple — הדוגמה המרכזית (הושק נובמבר 2020)</h3>
<div class="hl"><b>SOC = System on a Chip</b> ("מערכת על שבב") — צ'יפ שכולל <b>לא רק מעבד אלא גם רכיבי חומרה נוספים</b> על אותו שבב. אפשר ל-Apple להתנתק ממעבדי Intel (שהיו מונופול בשוק). <u>מלכודת מבחן:</u> SOC ≠ "Separation of Components" — לא הפרדת רכיבים אלא <b>איחוד</b>!</div>
<ul>
<li><b>ארכיטקטורת ARM</b> — אותה טכנולוגיה שמשמשת טלפונים ניידים; שונה מהותית מ-<b>x86</b> של Intel ו-AMD. מעבדי ARM <b>יעילים יותר</b> כי פותחו למכשירים ניידים עם <b>מגבלה תרמית</b> — ומכאן יתרון משמעותי בצריכת החשמל. עוצמת הביצועים שהושגה בסלולר שירתה גם מחשבים אישיים.</li>
<li><b>יעילות אנרגטית (Power Efficiency)</b> — ייצור בטכנולוגיית <b>5 ננומטר</b> (לעומת 7–10 ננומטר ב-Intel באותה עת): צריכת אנרגיה נמוכה + ביצועים גבוהים ← פחות חום, סוללה ארוכה, פחות פתרונות קירור ← מחשבים דקים, קלים ושקטים.</li>
<li><b>ביצועים — 8 ליבות CPU:</b> 4 ליבות <b>ביצועים</b> + 4 ליבות <b>יעילות</b> = ארכיטקטורת <b>big.LITTLE</b> ("קטן-גדול") — מתהליכים בסיסיים (גלישה) ועד מורכבים (עריכת וידאו, תלת-ממד). אומצה לאחר מכן גם על ידי Intel ו-AMD.</li>
<li><b>GPU מובנה — 7 או 8 ליבות</b> — ב-MacBook <b>אין אפשרות</b> לשלב מעבד גרפי נפרד; ה-GPU הוא חלק מה-SOC.</li>
<li><b>ארכיטקטורה אחודה (Unified Architecture)</b> — CPU, GPU ורכיבים נוספים על צ'יפ אחד: ממזער עיכובים במעבר המידע בין הרכיבים.</li>
<li><b>זיכרון מאוחד (Unified Memory Architecture)</b> — במקום מאגרי זיכרון נפרדים ל-CPU ול-GPU — מאגר אחד נגיש לכל הרכיבים. <b>ארבעה יתרונות (זה יתרון, לא חיסרון!):</b> (1) <b>יעילות</b> — מניעת העברות הלוך ושוב ← <b>Latency (השתהות) יורד</b> (2) <b>פישוט הפיתוח</b> — המפתחים לא מנהלים מאגרים נפרדים (3) <b>חיסכון בחשמל ואנרגיה</b> (4) <b>סקלביליות</b> — M2 ו-M3 נשענים על אותה ארכיטקטורה.</li>
<li><b>Neural Engine (ANE)</b> — יחידת עיבוד <b>ייעודית</b> ל-AI ולמידת מכונה: <b>16 ליבות</b>, עד <b>11 טריליון פעולות בשנייה</b>. דוגמאות: FaceID, מימוג'י, זיהוי פנים, תרגום, Siri. <u>להבחין:</u> זה מעבד ייעודי — <b>לא עוד סוג של CPU</b> (ה-CPU כללי ולכן איטי בפעילויות כאלה).</li>
<li><b>Secure Enclave (מעטפת אבטחה)</b> — מעבד משנה להצפנה ואבטחה: מגן על המידע הרגיש ביותר — סיסמאות, מידע ביומטרי (טביעת אצבע), אמצעי תשלום — ומפריד אותו מיתר המידע.</li>
<li><b>קונטרולרים</b> — רכיבי קלט/פלט: העברת מידע עד <b>40GB לשנייה</b>, תמיכה במסכי <b>6K</b>; חיבור מסכים, דיסקים, מקלדות ומצלמות דרך <b>USB-C</b>.</li>
<li><b>ISP — Image Signal Processor</b> — משפר וידאו וקול: הפחתת רעשי רקע, זיהוי פנים, התאמת גוונים לתאורה, <b>ייצוב תמונה</b> (שלא ניראה רוטטים בזום).</li>
<li><b>מקודדי מדיה</b> — מקטינים נפח פריטי מדיה ומעבדים להצגה: <b>H.264, AAC, MP3</b>.</li>
<li><b>המדד המסכם: Performance per Watt</b> — ביצועים ליחידת אנרגיה נצרכת — מדד היעילות הביצועית שה-M1 הגדיר מחדש.</li>
<li><b>סיכום היתרונות:</b> יעילות אנרגטית גבוהה, פליטת חום נמוכה (<b>MacBook Air מגיע ללא מאוורר</b>, ה-Pro שקט), משקל קטן, זיכרון משולב יעיל.</li>
<li><b>שלושת החסרונות של M1 (חדש — לא לפספס!):</b> (1) <b>תלות ביצרנית אחת</b> — Apple בלבד (2) <b>בעיות תאימות חלקיות</b> לתוכנות מסוימות (3) <b>חוסר אפשרות לשדרג רכיבים</b> לאחר הרכישה — כולל אחסון וזיכרון.</li>
</ul>
<h3>תוכנה (Software) — שלושת הסוגים</h3>
<p><b>תוכנה</b> = האפליקציות, התוכניות והיישומים, וגם שפות הפיתוח ומערכת ההפעלה — כל מה שמנחה את רכיבי החומרה כיצד לפעול. לעיתים פועלת בלי שהמשתמש מודע — אך חיונית.</p>
<ul>
<li><b>מערכות הפעלה</b> — <b>שכבת התוכנה הראשונה שמתקשרת עם החומרה</b>: מנהלת את משאבי החומרה ומהווה פלטפורמה להפעלת תוכנות אחרות. טלפונים: <b>Android ו-iOS</b>; מחשבים אישיים: Windows, ובמחשבי Mac — macOS; פיתוח ושרתים: Linux. לכל מערכת דרישות חומרה שונות.</li>
<li><b>אפליקציות</b> — מה שמפעילים בשוטף: דפדפנים, Microsoft 365 / Office, משחקים, עריכת וידאו, מערכות רפואיות.</li>
<li><b>שפות תכנות</b> — כלי המפתחים ליצירת תוכנה ולשינוי קוד: <b>Python</b> (נפוצה מאוד, ארגז כלים רחב — למשל עיבוד סטטיסטי בחבילות מוכנות), JavaScript, PHP, SQL.</li>
</ul>
<h3>תאימות חומרה–תוכנה</h3>
<div class="hl"><b>משל המכונית:</b> החומרה היא השלד וגוף המכונית; התוכנה היא הלב הפועם — המנוע. כשם שמכונית לא תיסע בלי מנוע — מערכת מחשב, משוכללת ככל שתהיה בפן החומרה, לא תפעל ללא תוכנה מתאימה. <b>תאימות = סינרגיה מחייבת.</b> לא כל תוכנה רצה על כל חומרה — ולא להפך. דוגמה עסקית: בית השקעות (ברוקר) — החומרה (שרתים ורשת מהירים) + התוכנה (קנייה, מכירה והתניות בשברירי שנייה) = אלפי עסקאות ביום וניצול תנודות השוק.</div>

summary: `
<h3>מהי בינה עסקית</h3>
<p><b>BI — Business Intelligence</b> — התהליך הארוך והמורכב של <b>איסוף, עיבוד וניתוח מידע כבסיס לקבלת החלטות</b> בסביבה העסקית התחרותית המודרנית — כוח מניע בעסקים היום. המערכות נשענות על כלים מתקדמים לאיסוף מידע ממגוון מקורות, סוגים ופורמטים — מתוך הארגון ומחוצה לו — מנקות ומעדכנות אותו, מעבדות ומציגות בפורמט ידידותי לפי צורכי הארגון.</p>
<div class="hl"><b>נקודה חשובה:</b> BI אינו מושג חדשני בפני עצמו — גם חישוב ממוצע ציונים או הפקת דוח מכירות הם BI בסיסי. מה שהשתנה: הדיון היום נוגע לכלים מתקדמים בהרבה — כלי ניתוח מתקדמים ואפשרויות <b>חיזוי</b>. אין צורך בהבנה טכנית עמוקה של המנוע — החשוב הוא הבנת התהליכים שאנחנו מקבלים כמובנים מאליהם.</div>
<h4>שלוש התכונות הייחודיות של BI מודרנית</h4>
<ul>
<li><b>ריבוי מקורות</b> — חיבור מערכות ומקורות מידע שונים.</li>
<li><b>זמן אמת</b> — עדכון שוטף של המידע.</li>
<li><b>מבט קדימה</b> — ניבוי והמלצה, לעומת מערכת קלאסית שמסבירה רק את העבר.</li>
</ul>
<h3>ארבעת הרכיבים + המשלים לזכירה</h3>
<table>
<tr><th>רכיב</th><th>תפקיד</th><th>המשל מהשיעור</th></tr>
<tr><td><b>Data Warehouse</b><br>(מחסן נתונים)</td><td>הרכיב הגולמי ביותר: מכיל באופן מסודר מאגרי מידע בעלי משמעות גבוהה לארגון — שאפשר למצוא, להתמצא, לנתח ולהשתמש כבסיס להחלטות.</td><td>חדר גדול עם ארוניות מסודרות וממוינות היטב לכל המידע האישי המפוזר שלנו</td></tr>
<tr><td><b>Data Marts</b></td><td>קבוצת משנה של המידע שבמחסן, <b>ספציפית לתחום</b> (רק מכירות / רק שיווק). החלוקה חיונית: לא כל בעלי התפקידים זקוקים לכל המידע — והגישה צריכה להיות מהירה ויעילה.</td><td>ספריית המרכז האקדמי = ה-Warehouse; מדף ספרי מערכות המידע = ה-Mart</td></tr>
<tr><td><b>ETL</b></td><td><b>Extract</b> — איסוף המידע ממקורות שונים: מסדי נתונים, גיליונות אלקטרוניים וקבצים · <b>Transform</b> — ניקוי, ארגון ושינוי המידע כך שיתאים לניתוח · <b>Load</b> — טעינת המידע המעובד למחסני נתונים נגישים למשתמשים.</td><td>המטבח: איסוף המצרכים מהמדפים ← בישול והכנה ← עריכת השולחן והגשה</td></tr>
<tr><td><b>Visualization</b></td><td>המחשה חזותית של הממצאים: גרפים, תרשימים ותמונות הנקלטים בעין בקלות — לזיהוי דפוסים, תבניות ומגמות.</td><td>ערמת נתוני מכירות גולמית = רשימת מצרכים מבלבלת; תמונת המנה המוגמרת מספרת סיפור ברור</td></tr>
</table>
<p><b>מסלול המידע הכולל:</b> המידע מצוי ב-Data Warehouse ← מחולק ל-Data Marts ← עובר תהליכי ETL ← מוצג ב-Visualization.</p>
<h3>כלים מסחריים</h3>
<ul>
<li><b>Tableau</b> — מבית <b>Salesforce</b>; אינטואיטיבית יחסית, ממשק גרפי של <b>Drag and Drop</b> (גרירה ושחרור) ליצירת ויזואליזציות.</li>
<li><b>Power BI</b> — מבית <b>Microsoft</b>; חלק אינטגרלי מ-Microsoft 365; כלי רב-עוצמה למידול מידע ולדיווח; יתרון: עבודה מצוינת עם יתר מוצרי Microsoft.</li>
<li>השימוש <b>חוצה סקטורים</b>: קמעונאות, רפואה, פיננסים, השכלה גבוהה ועוד — לא ספציפי לתעשייה.</li>
</ul>
<h3>שני התוצרים המרכזיים</h3>
<h4>Dashboard — שלושת המאפיינים (משל תא הטייס)</h4>
<ul>
<li><b>Control Center (מרכז בקרה)</b> — ריכוז כל המידע הקריטי הנדרש להחלטה, למעקב ולבקרה.</li>
<li><b>Information Hub</b> — צירוף מידע ממקורות שונים והצגתו בנקודה אחת, במסך אחד — במקום לחפור בקבצים.</li>
<li><b>At a glance (במבט מהיר)</b> — תרשימים ומחוונים שמייצרים מידע חזותי מובן מיד, בלי חישוב עצמאי (כמו חיווי דלק/מהירות במכונית).</li>
</ul>
<p>הקוקפיט: כל המידע הקריטי לטיסה במקום אחד מול העיניים — גם כשהחיישנים מפוזרים במקומות שונים לגמרי.</p>
<h4>KPIs — Key Performance Indicators (מדדי ביצוע מרכזיים)</h4>
<p>ערך מספרי ספציפי המספק מידע ביצועי <b>מדיד</b>, מתעדכן ומסתנכרן <b>בזמן אמת</b> מול מטרות ויעדי הארגון — דרך בהירה למדוד הצלחה ולבצע פעולות מתקנות מדויקות. שלושה רכיבים:</p>
<ul>
<li><b>Score Cards (לוחות ניקוד)</b> — טבלאות נתונים מתעדכנות להערכת ביצועי פרויקטים, תהליכים ומכירות (משל: לוח ניקוד בכדורסל — נקודות, ריבאונדים, אסיסטים).</li>
<li><b>Performance Metrics (מדדי ביצוע)</b> — הממדים של המידע הביצועי, כל אחד נמדד בנפרד: נתח שוק, זמן מענה, שביעות רצון לקוחות, פרודוקטיביות.</li>
<li><b>Goal Oriented (מוכוונות מטרה)</b> — המדד <b>חייב להיות קשור בבירור למטרה או יעד מוגדר</b>. דוגמאות: דירוג 5 בסקר הוראה למרצה; יעד +10% מכירות השנה. זה מה שהופך Metric ל-KPI.</li>
</ul>
<h3>העתיד והאתגרים</h3>

<h3>AI — בינה מלאכותית: המושג הרחב</h3>
<ul>

<li><b>AI קלאסי</b> — הסקה לפי חוקים ברורים; התקיים כבר במערכות המידע של <b>שנות ה-80</b>. מה שהשתנה היום: הרכיבים הפכו מתקדמים ומתוחכמים בהרבה — וזה מה שיצר את תשומת הלב.</li>

<h3>ML — למידת מכונה: השלב הבא</h3>

<h4>תהליך האימון — שרשרת המושגים</h4>
<ul>
<li><b>Data Samples (מדגמי נתונים)</b> — המידע הראשוני שנאסף; בלעדיו אין למידה.</li>

<li><b>Supervised Training (למידה מושגחת)</b> — אימון באמצעות מידע ראשוני <b>מתויג</b>; השיטה המקובלת ברוב התרחישים (קיימים גם מודלים ללא תיוג).</li>

<h3>DL — למידה עמוקה: פריצת הדרך</h3>
<ul>
<li>תת-משפחה של ML; הייחוד: <b>מדלגת לגמרי על שלב מיצוי המאפיינים</b> ולומדת <b>ישירות מהמידע הגולמי</b>.</li>
<li>מחקה את אופן הפעולה של המוח האנושי יותר מכל טכנולוגיה אחרת: בני אדם לא תוכנתו לזהות עצמים — הלמידה נוצרה מהתנסות, דרך התשתית הנוירונית. <b>רשת נוירונית מלאכותית</b> = רשת קשרים רב-שכבתית <b>בהשראת המוח — אך פועלת באופן שונה</b> (לא זהה למוח!).</li>
<li><b>מבנה הרשת:</b> <b>Input Layer</b> (שכבת הקלט — המידע הגולמי, הפיקסלים) ← <b>Hidden Layers</b> (שכבות מוסתרות — <b>אינן מוגדרות במפורש</b>; המחשב רץ על הנתונים <b>שוב ושוב</b> ולומד בעצמו לאפיין את הקשרים דרך <b>ריצות חוזרות</b>, ומנסה לייצר את הנוסחה שמתארת הכי טוב את הקשר קלט↔פלט במינימום שגיאות) ← <b>Output</b> (הפלט — האם זוהה הרכיב). "העומק" = עומק הרשתות ומורכבות הקשרים. <i>(המרצה ציין: אין דרישה להגדיר רשת נוירונית במבחן — העיקרון הוא החשוב.)</i></li>

<li><b>ImageNet</b> — מאגר התמונות הציבורי הגדול ביותר, אלפי קטגוריות: בלמידת מכונה קלאסית שיעור טעויות הזיהוי היה כ-<b>25%</b>; בזכות למידה עמוקה — כ-<b>4%</b> ואף פחות.</li>
</ul>

 1: שני הממדים המגדירים את המערכת הם אוטומציה של תהליכים עסקיים ואינטגרציה ביניהם — כאשר האינטגרציה היא הרכיב הקריטי\nטענה 2: הכלל שהוצג בקורס: כשתוכנת הספק אינה חופפת לתהליכי הארגון, מתאימים את התהליך העסקי למערכת\nטענה 3: הטמעות כושלות של ERP עלו לחברות עשרות מיליוני דולרים","options":["טענה 3 בלבד","כל הטענות נכונות","טענות 1 ו-2","טענות 1 ו-3","טענה 1 בלבד"],"answer":3,"explain":"טענות 1 ו-3 נכונות. טענה 2 הפוכה — מתאימים את המערכת לתהליך, לא את התהליך למערכת."},{"q":"לפניכם מספר טענות לגבי מערכות ERP:\nטענה 1: TCO (עלות בעלות כוללת) כוללת, מעבר לתוכנה ולרישיון, גם עלויות אפיון, בחירה, הכשרת עובדים, תקלות הטמעה ותקופת למידה\nטענה 2: ערך ה-ROI נקבע במידה המשמעותית ביותר על ידי פרק הזמן הכולל עד להנבת התועלת מההתייעלות — בין שנה לעשר שנים\nטענה 3: התועלת הקלה יחסית למדידה היא צמצום המלאי, ואילו פרודוקטיביות העובדים קשה יותר לכימות","options":["כל הטענות נכונות","טענות 1 ו-2","טענות 1 ו-3","טענה 1 בלבד","טענה 2 בלבד"],"answer":0,"explain":"שלוש הטענות נכונות — כולן מהדיון בכדאיות הכלכלית של ERP."},{"q":"לפניכם מספר טענות לגבי היכולות הפרקטיות של ERP:\nטענה 1: אוטומציה של תהליכי רכש כוללת קישור לקטלוגי ספקים, רכישות לפי כללים ותעריפים, ייעול אישורים לפי מדרג סמכויות וניצול הנחות\nטענה 2: ניהול חשבוניות במערכת כולל שליפת מידע גם מחשבוניות סרוקות או דיגיטליות\nטענה 3: ניהול נכסים במערכת כולל מעקב אחר אחריות, תחזוקה, שווי, הפחתה ומיקום","options":["טענות 1 ו-3","טענה 1 בלבד","כל הטענות נכונות","טענות 1 ו-2","טענה 2 בלבד"],"answer":2,"explain":"שלוש הטענות נכונות — אלו בדיוק היכולות שפורטו בשיעור המאפיינים הפרקטיים של ERP."},{"q":"לפניכם מספר טענות לגבי מערכות מסחר אלקטרוני:\nטענה 1: פלטפורמות C2C עוסקות במכירה בין צרכנים / גופים פרטיים (לא עסקים) ודוגמה לפלטפורמה כזו היא Amazon Business\nטענה 2: בהקשר להתפתחויות וכלים במסחר אלקטרוני, המושג ויזואליזציה הוגדר כהתאמה חזותית וגרפית של מערכות המסחר למובייל\nטענה 3: הצפנת SSL היא כלי שיוצר קישור מוצפן בין שרת הנתונים והדפדפן","options":["טענה 1 בלבד","טענה 3 בלבד","טענה 2 בלבד","טענות 1 ו-3","כל הטענות שגויות"],"answer":1,"exam":true,"explain":"טענה 1 שגויה — Amazon Business היא B2B. טענה 2 שגויה — ויזואליזציה = הצגה אינטראקטיבית של מוצרים; ההתאמה לנייד היא 'מסחר במובייל'. טענה 3 נכונה."},{"q":"לפניכם מספר טענות לגבי מסחר אלקטרוני:\nטענה 1: Alibaba היא דוגמה לפלטפורמת B2B ואילו AliExpress היא דוגמה לפלטפורמת B2C\nטענה 2: מודל B2C מגדיל בו-זמנית את ההיצע ואת הביקוש\nטענה 3: אתגר מרכזי בפלטפורמות C2C הוא היעדר רגולציה מסודרת וחקיקה","options":["טענות 1 ו-2","כל הטענות נכונות","טענה 3 בלבד","טענה 1 בלבד","טענות 2 ו-3"],"answer":1,"explain":"שלוש הטענות נכונות — שיוך הדוגמאות, השפעת B2C על היצע וביקוש, ואתגר הרגולציה ב-C2C."},{"q":"לפניכם מספר טענות:\nטענה 1: יחידת העיבוד המרכזי במחשב נקראת GPU והיא אחראית על רוב הפעולות החישוביות במחשב האישי\nטענה 2: בהגדרה, מעבד CPU כולל ליבה אחת; ואילו מעבדים מסוג GPU כוללים תמיד יותר מליבה אחת\nטענה 3: ה-GPU מתוצרת Nvidia משווק תחת המותג Radeon","options":["טענה 1 בלבד","כל הטענות שגויות","טענה 2 בלבד","טענה 3 בלבד","טענות 2 ו-3"],"answer":1,"exam":true,"explain":"טענה 1 — יחידת העיבוד המרכזית היא CPU. טענה 2 — מעבדים מודרניים מרובי ליבות. טענה 3 — Radeon = AMD; מותג Nvidia = GeForce. כל הטענות שגויות."},{"q":"לפניכם מספר טענות:\nטענה 1: במחשבי PC מבוססי Windows, מעבדים מסדרה U שמים דגש על ליבות ביצועים לעבודה מהירה על משימות מורכבות\nטענה 2: ה-RAM הוא רכיב החומרה שמיועד לשמירת נתונים וקבצים לזמן ארוך במחשבי PC\nטענה 3: אם קיימים צרכים הדורשים כוח עיבוד גרפי חזק, יידרש GPU נפרד — והחברה היחידה המייצרת אותם היא AMD","options":["כל הטענות שגויות","טענה 1 בלבד","טענה 2 בלבד","טענה 3 בלבד","כל הטענות נכונות"],"answer":0,"exam":true,"explain":"טענה 1 — סדרת U מכוונת לחיסכון בהספק. טענה 2 — אחסון ארוך טווח = Storage, לא RAM. טענה 3 — גם Nvidia מייצרת GPU נפרד. כל הטענות שגויות."},{"q":"לפניכם מספר טענות לגבי מעבד ה-M1 של Apple:\nטענה 1: המעבד מיוצר בטכנולוגיית 5 ננומטר, לעומת תהליכי 7 ו-10 ננומטר שהיו מקובלים אז במעבדי Intel\nטענה 2: ה-CPU כולל 8 ליבות: 4 ליבות ביצועים ו-4 ליבות יעילות — ארכיטקטורה המכונה big.LITTLE\nטענה 3: ה-Neural Engine הוא יחידת עיבוד ייעודית ל-AI ולמידת מכונה, בעלת 16 ליבות","options":["טענה 1 בלבד","טענות 1 ו-2","כל הטענות נכונות","טענה 2 בלבד","טענות 2 ו-3"],"answer":2,"explain":"שלוש הטענות נכונות — כולן ממאפייני ה-M1 שהוצגו בשיעור."},{"q":"לפניכם מספר טענות לגבי בינה עסקית (BI):\nטענה 1: ארבעת רכיבי מערכת BI הם: Data Warehouse, Data Marts, ETL ו-Visualization\nטענה 2: ראשי התיבות ETL הם Extract, Transform, Load\nטענה 3: Data Mart הוא קבוצת משנה ספציפית לתחום מתוך ה-Data Warehouse — למשל רק נתוני מכירות","options":["טענות 1 ו-2","טענות 1 ו-3","טענה 3 בלבד","טענה 1 בלבד","כל הטענות נכונות"],"answer":4,"explain":"שלוש הטענות נכונות — הרכיבים, פירוש ה-ETL והגדרת ה-Data Mart."},{"q":"לפניכם מספר טענות לגבי AI, ML ו-DL:\nטענה 1: המושג בינה מלאכותית נטבע בשנות ה-50 של המאה ה-20 על ידי ג'ון מקארת'י\nטענה 2: למידת מכונה (ML) היא תת-קבוצה של בינה מלאכותית, ולמידה עמוקה (DL) היא תת-קבוצה של למידת מכונה\nטענה 3: הייחוד של למידה עמוקה: היא מדלגת על שלב מיצוי המאפיינים ולומדת ישירות מהמידע הגולמי","options":["טענה 2 בלבד","כל הטענות נכונות","טענות 1 ו-2","טענה 1 בלבד","טענות 2 ו-3"],"answer":1,"explain":"שלוש הטענות נכונות — מקארת'י ושנות ה-50, היררכיית שלושת המעגלים, והדילוג על מיצוי המאפיינים ב-DL."},{"q":"לפניכם מספר טענות לגבי למידת מכונה:\nטענה 1: Supervised Training (למידה מושגחת) היא אימון מודל באמצעות מידע ראשוני מתויג (Labels)\nטענה 2: אחת ממגבלות מיצוי המאפיינים: הפיכת מידע גולמי עשיר לרשימת ערכים משליכה החוצה חלק גדול מהמידע\nטענה 3: במאגר ImageNet, שיעור טעויות הזיהוי בלמידת מכונה קלאסית היה כ-4%, ובזכות הלמידה העמוקה ירד לכ-25%","options":["כל הטענות נכונות","טענות 1 ו-3","טענה 1 בלבד","טענות 1 ו-2","טענה 2 בלבד"],"answer":3,"explain":"טענות 1 ו-2 נכונות. טענה 3 הפוכה — מ-25% בלמידת מכונה קלאסית ל-4% ואף פחות בלמידה עמוקה."}]});

(window.__MIS_EXAMS__ = window.__MIS_EXAMS__ || []).push({"title":"מבחן מסכם 2","questions":[{"q":"לפניכם מספר טענות:\nטענה 1: מערכת השמה דגש על פעולות בזמן אמת (Real Time) כולל אמצעים שמטרתם למזער טעויות ולשמור על מהימנות ודיוק המידע ושלמותו, כולל גיבויים למצבי קריסה – היא מערכת MIS\nטענה 2: מערכת העוסקת במתן מידע ניהולי לשם קבלת החלטות ניהוליות שוטפות על ידי דרגי הביניים היא מערכת TPS\nטענה 3: מערכת המתמקדת בהחלטות מנהלות ומנהלים בכירים וכן בהחלטות אסטרטגיות לטווח ארוך היא מערכת ESS","options":["טענה 1 בלבד","טענות 1 ו-3","טענה 3 בלבד","טענה 2 בלבד","כל הטענות שגויות"],"answer":2,"exam":true,"explain":"טענה 1 מתארת את TPS. טענה 2 מתארת את MIS. טענה 3 נכונה — ESS = החלטות בכירים אסטרטגיות."},{"q":"לפניכם מספר טענות:\nטענה 1: מערכת היוצרת את המידע הבסיסי והראשוני ברמה הארגונית, ושמה דגש על תיעוד ורישום פעולות בזמן אמת, כולל גיבויים למצבי קריסה – היא מערכת MIS\nטענה 2: האפיון וההטמעה של מערכות MIS לא דורשת הבנה של התהליך הארגוני: המערכת מגיעה מוכנה לכל צורך בכל ארגון\nטענה 3: חברה התקינה מערכת שסוגי המידע המתקבלים ממנה הם חתכים וניתוחים בסיסיים ברמת ניהול מחלקה וניהול מלאי. לפיכך, מדובר במערכת ESS","options":["טענה 3 בלבד","כל הטענות שגויות","טענה 1 בלבד","טענה 2 בלבד","טענות 1 ו-3"],"answer":1,"exam":true,"explain":"טענה 1 מתארת TPS. טענה 2 שגויה — MIS מחייבת הבנת התהליך הארגוני. טענה 3 שגויה — חתכים בסיסיים ברמת מחלקה = MIS. כל הטענות שגויות."},{"q":"לפניכם מספר טענות:\nטענה 1: בדוגמת חנות האפליקציות, בעת הורדת אפליקציה המערכת מתעדת את הפעולה, מנהלת את התשלום ומוודאת ביצוע תקין — הדגמה של מערכת TPS\nטענה 2: מערכת TPS מטפלת בהיקפים של מיליוני עסקאות בתדירות יום-יומית גבוהה\nטענה 3: הדיוק במערכות TPS קריטי במיוחד בהקשרים כספיים ורפואיים","options":["כל הטענות נכונות","טענות 1 ו-2","טענה 3 בלבד","טענה 1 בלבד","טענות 2 ו-3"],"answer":0,"explain":"שלוש הטענות נכונות — דוגמת חנות האפליקציות, יתרון ההיקף והתדירות, וחשיבות הדיוק בכספים וברפואה."},{"q":"לפניכם מספר טענות:\nטענה 1: בדוגמת חנות Apple: נתוני המכירות זהים בשתי המערכות — ה-TPS מתעד כל מכירה, וה-MIS מנתחת אילו מוצרים נמכרים בהיקפים גבוהים וכיצד לנתב משאבים\nטענה 2: הכלל להבחנה: TPS מתמקדת בדיוק וביעילות של איסוף הנתונים; MIS מתמקדת במתן אינפורמציה לקבלת החלטות\nטענה 3: מערכת MIS יוצרת את המידע הבסיסי והראשוני ברמה הארגונית","options":["טענות 1 ו-3","כל הטענות נכונות","טענות 1 ו-2","טענה 1 בלבד","טענה 2 בלבד"],"answer":2,"explain":"טענות 1 ו-2 נכונות — הדוגמה והכלל מהשיעור. טענה 3 שגויה — את המידע הראשוני יוצרת TPS."},{"q":"לפניכם מספר טענות:\nטענה 1: תחזית ביקושים היא הערכת ביקוש עתידי שמופקת ממערכת MIS לתמיכה בניהול מלאי ואספקה\nטענה 2: מערכת MIS עושה שימוש במחקרי שוק ובנתוני מתחרים כמקורות מידע מרכזיים\nטענה 3: יעילות ניהולית היא התוצאה של תקשור המידע הנכון למחלקות ולבעלי התפקידים המתאימים","options":["טענה 1 בלבד","טענות 2 ו-3","כל הטענות נכונות","טענה 3 בלבד","טענות 1 ו-3"],"answer":4,"explain":"טענות 1 ו-3 נכונות. טענה 2 שגויה — מחקרי שוק ונתוני מתחרים הם מידע חיצוני = ESS."},{"q":"לפניכם מספר טענות:\nטענה 1: בדוגמת Apple שהוצגה בשיעור ESS: דשבורד בזמן אמת עם מכירות עולמיות, היקפים אזוריים ותחזיות — לצורך החלטות על השקות והקצאת משאבים\nטענה 2: מערכת ESS מסייעת לזיהוי טרנדים באמצעות איסוף מידע מרשתות חברתיות ומקורות חיצוניים נוספים\nטענה 3: דוח תקופתי מודפס הוא הכלי המרכזי והמספק לדרג הניהולי הבכיר","options":["טענה 2 בלבד","טענות 1 ו-2","כל הטענות נכונות","טענה 1 בלבד","כל הטענות שגויות"],"answer":1,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — דוחות תקופתיים אינם מספקים לדרג הבכיר; הוא זקוק לתמונה חזותית, עדכנית וצופה קדימה."},{"q":"לפניכם מספר טענות:\nטענה 1: סנטימנט שווקים — התנהגות ומצב הרוח של השווקים — הוא מבין הנושאים שמערכת ESS צופה וחוזה\nטענה 2: איתנות פיננסית ומיזוגים ורכישות הם נושאים שבהם ESS תומכת\nטענה 3: חדירה לשווקים חדשים משמעותיים היא דוגמה להחלטה שוטפת הנשענת על MIS","options":["טענה 1 בלבד","כל הטענות נכונות","טענה 3 בלבד","טענות 1 ו-2","טענה 2 בלבד"],"answer":3,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — חדירה לשווקים חדשים היא החלטה אסטרטגית = ESS."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: העקרונות הבסיסיים של מערכות CRM נשענים על 3 זרועות: שירות שוטף, ניתוח מידע מתקדם ואוטומציה\nטענה 2: מערכות CRM לבדן אינן יכולות לשפר את שביעות רצון הלקוחות, שכן נדרש מאמץ מצד החברה ברמה הארגונית והניהולית\nטענה 3: מערכות CRM מאפשרות לשאוב נתונים ממגוון ערוצי התקשרויות","options":["טענה 1 בלבד","טענות 1 ו-3","כל הטענות נכונות","טענות 1 ו-2","טענה 3 בלבד"],"answer":2,"exam":true,"explain":"שלוש הטענות נכונות: שלוש הזרועות, הצורך במאמץ ארגוני, ושאיבה ממגוון ערוצים."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: המערכות מאפשרות לנציגים לקבל מידע מפורט על המידע האישי והיסטוריית הרכישות, אך העדפות הקנייה אינן חשופות לחברה או לנציגיה\nטענה 2: המערכות מאפשרות לשאוב נתונים רק מערוצי ההתקשרות הרשמיים — דוא\"ל, פקס ודואר; פניות ברשתות חברתיות או וואטסאפ אינן ניתנות לתיעוד\nטענה 3: מערכות CRM מיועדות להעניק שירות שוטף בצורה המהירה ביותר, ולא לאפשר ניתוח מידע מתקדם","options":["טענה 1 בלבד","כל הטענות שגויות","טענה 2 בלבד","טענות 1 ו-3","כל הטענות נכונות"],"answer":1,"exam":true,"explain":"טענה 1 — גם העדפות הקנייה חשופות לנציגים. טענה 2 — המערכת שואבת מכל הערוצים כולל וואטסאפ ורשתות. טענה 3 — ניתוח מתקדם הוא חלק מהותי. כל הטענות שגויות."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: טרגוט משמעו קביעת קהל היעד הרלוונטי לפי מאפייני לקוחות — גיל, מיקום והרגלי צריכה — לצורך שיווק יעיל יותר\nטענה 2: תוכניות נאמנות ומועדוני לקוחות הם כלים מבוססי מידע המחזקים את הקשר למותג ותורמים לשימור\nטענה 3: המערכת יכולה להקטין את תחושת ה\"הטרדה\" על ידי הימנעות מהצעת מוצרים לא רלוונטיים — למשל מוצר שכבר נרכש","options":["טענות 1 ו-3","טענה 1 בלבד","טענה 3 בלבד","טענות 1 ו-2","כל הטענות נכונות"],"answer":4,"explain":"שלוש הטענות נכונות — טרגוט, מועדוני לקוחות ומניעת הטרדה הם יתרונות שהוצגו בשיעור."},{"q":"לפניכם מספר טענות לגבי רכיבי מערכת CRM:\nטענה 1: רכיב שירות הלקוחות (Front Office) כולל גם After Sales Service — פעילות לאחר המכירה: שדרוגים וטיפול בתלונות\nטענה 2: רכיב אוטומציית המכירה מזהה, בין היתר, את נקודת נטישת הרכישה\nטענה 3: רכיב ניהול הקמפיינים עוסק בהזמנה אוטומטית של מלאי מהספקים כשהביקוש עולה","options":["טענה 2 בלבד","טענות 1 ו-2","טענות 2 ו-3","כל הטענות נכונות","טענה 1 בלבד"],"answer":1,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — קמפיינים = מסעות פרסום; הזמנות אוטומטיות מספקים שייכות ל-ERP."},{"q":"לפניכם מספר טענות:\nטענה 1: לא ניתן ליישם מערכת CRM מבלי להבין בצורה טובה את כל התהליכים העסקיים בארגון ללא יוצא מן הכלל, כולל ניהול מלאי, הקצאת עובדים וטיפול בשכר\nטענה 2: אוטומציה של תהליכי רכש מספקים היא יכולת אפשרית של מערכות ERP\nטענה 3: מערכת ERP היא מערכת שאחד מיתרונותיה המרכזיים הוא הקלות שבה ניתן להקים ולהטמיע אותה","options":["טענה 1 בלבד","טענה 2 בלבד","טענה 3 בלבד","טענות 1 ו-2","כל הטענות שגויות"],"answer":1,"exam":true,"explain":"טענה 1 שגויה — הבנת כל התהליכים נדרשת ל-ERP; CRM ממוקדת בלקוחות. טענה 2 נכונה. טענה 3 שגויה — ההטמעה מורכבת."},{"q":"לפניכם מספר טענות לגבי יתרונות ERP:\nטענה 1: שליטה במלאים מונעת מכירות אבודות (חוסרים), פריטים פגי תוקף ועלויות אחזקת מלאי עודף\nטענה 2: הזמנות חירום הנובעות מטעויות וחוסרים זולות בדרך כלל מהזמנות הנובעות מניהול אחראי\nטענה 3: המערכת מאפשרת זיהוי מחוללי עלות — הגורמים המובילים לעלויות — מתוך הנתונים הפיננסיים","options":["טענות 1 ו-3","טענה 1 בלבד","טענות 1 ו-2","כל הטענות נכונות","טענה 3 בלבד"],"answer":0,"explain":"טענות 1 ו-3 נכונות. טענה 2 הפוכה — הזמנות חירום יקרות בהרבה, והמערכת מצמצמת אותן."},{"q":"לפניכם מספר טענות לגבי ERP:\nטענה 1: תוכנת מדף היא מערכת ERP כללית לא מותאמת, הכוללת את התהליכים המרכזיים ברוב החברות; לחלופין ניתן \"לתפור\" מערכת ממודולים\nטענה 2: יישום בענן (Cloud) משמעו נגישות למערכת דרך תקשורת אינטרנט במקום התקנה על מחשבי הארגון\nטענה 3: SAP, Oracle ו-Microsoft Dynamics הן מבין יצרניות ה-ERP המוכרות","options":["טענה 1 בלבד","טענות 1 ו-2","כל הטענות נכונות","טענות 2 ו-3","טענה 3 בלבד"],"answer":2,"explain":"שלוש הטענות נכונות — תוכנת מדף מול מודולים, יישום בענן, והיצרניות המוכרות."},{"q":"לפניכם מספר טענות לגבי ERP:\nטענה 1: מדרג סמכויות הוא ההיררכיה לאישור הוצאות מול הממונים, שהמערכת מיישמת בתהליך ניהול ההוצאות\nטענה 2: התוצר המרכזי של האוטומציה והאינטגרציה הוא למידה ארגונית משופרת\nטענה 3: שילוב ERP 2 נכונות. טענה 3 הפוכה — האוטומציה מפחיתה את התלות בגורם האנושי."},{"q":"לפניכם מספר טענות:\nטענה 1: שלוש היכולות של ESS שהוצגו: ניתוח נתונים מורכבים, הבנת מגמות ותחזיות לעתיד, והצפת נתונים מרכזיים הדורשים התעמקות של הדרג הבכיר\nטענה 2: מערכת ESS עוסקת רק במה שקרה בעבר ואינה צופה קדימה\nטענה 3: דשבורד הוא תצוגה ויזואלית של אינדיקטורים עיקריים, המשתנה בזמן אמת","options":["טענות 1 ו-3","טענה 3 בלבד","טענה 1 בלבד","טענות 1 ו-2","כל הטענות נכונות"],"answer":0,"explain":"טענות 1 ו-3 נכונות. טענה 2 שגויה — ESS מספקת גם תחזיות ומבט קדימה."},{"q":"לפניכם מספר טענות:\nטענה 1: מערכות המידע יוצרות שרשרת: נתון ← אינפורמציה ← החלטה ← יתרון תחרותי\nטענה 2: ראייה הוליסטית משמעה תמונה שלמה של הביצועים הכספיים והתנהגות השווקים, הנוצרת משילוב מקורות מידע מגוונים\nטענה 3: מערכת MIS מספקת להנהלה הבכירה מידע אסטרטגי מבוסס גרפים ותרשימים","options":["טענה 2 בלבד","כל הטענות נכונות","טענות 1 ו-2","טענה 1 בלבד","טענות 2 ו-3"],"answer":2,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — מידע אסטרטגי גרפי להנהלה הבכירה = ESS."},{"q":"לפניכם מספר טענות:\nטענה 1: הדוגמה של בנק One Zero מציגה בנק שמבסס את הצעת הערך על ייעוץ והמלצות בכלי בינה מלאכותית מתוך נתוני החשבון\nטענה 2: בדוגמת מתן האשראי, הבנק זקוק למידע על הכנסות, הוצאות והתחייבויות כדי להחליט על אישור ההלוואה ועל הריבית\nטענה 3: כמות גדולה של מידע גולמי היא כשלעצמה יתרון עסקי, גם ללא עיבוד","options":["כל הטענות נכונות","טענה 2 בלבד","טענות 1 ו-3","טענה 1 בלבד","טענות 1 ו-2"],"answer":4,"explain":"טענות 1 ו-2 נכונות — שתי הדוגמאות מהשיעור. טענה 3 שגויה — בלי עיבוד נכון, המידע הוא הצפה ולא ערך."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: מערכות CRM צמחו מעולם ה-MIS והן מיועדות אך ורק לשימור לקוחות קיימים. אין להן כל ערך בכל הקשור לגיוס לקוחות חדשים או לנושאים הקשורים להכנסות החברה\nטענה 2: מערכת CRM אוספת מידע מערוץ התקשרות יחיד שמוגדר על ידי החברה\nטענה 3: מערכות CRM החליפו לחלוטין את הצורך באנשי מכירות ושירות בארגונים","options":["טענה 1 בלבד","טענה 2 בלבד","כל הטענות שגויות","טענות 1 ו-2","טענה 3 בלבד"],"answer":2,"exam":true,"explain":"טענה 1 — המטרות כוללות גם גיוס והגדלת הכנסות. טענה 2 — מגוון ערוצים, לא אחד. טענה 3 — המערכת מסייעת לאנשי המכירות, לא מחליפה. כל הטענות שגויות."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: המושג \"לקוח חם\" או \"ליד חם\" מתייחס ללקוחות פוטנציאליים שהמידע לגביהם התקבל במערכת בשעה האחרונה\nטענה 2: מערכת ה-CRM עשויה לסייע לשפר את תהליך המכירה ללקוחות תוך התבססות על מידע והיסטוריית התקשרויות\nטענה 3: המערכת מאפשרת טיפול דיפרנציאלי בלקוחות על בסיס הנתונים וההיסטוריה שלהם","options":["טענות 2 ו-3","טענה 2 בלבד","טענה 1 בלבד","כל הטענות נכונות","טענה 3 בלבד"],"answer":0,"exam":true,"explain":"טענה 1 שגויה — ליד חם = מוכנות לקנייה, לא מועד קבלת הנתונים. טענות 2 ו-3 נכונות."},{"q":"לפניכם מספר טענות לגבי מדדי CRM:\nטענה 1: לארגון מודרני אסור להניח מהם צורכי הלקוחות — יש להתבסס על נתונים והסקת מסקנות\nטענה 2: ניתן למדוד שביעות רצון לקוחות על בסיס נתוני הצרכים בלבד, גם ללא נתוני תגובות הארגון\nטענה 3: נאמנות לקוחות נמדדת בין היתר במשוב, בעסקאות, בביקורים באתר ובהמלצות","options":["טענות 1 ו-3","טענה 3 בלבד","טענה 1 בלבד","כל הטענות נכונות","טענות 1 ו-2"],"answer":0,"explain":"טענות 1 ו-3 נכונות. טענה 2 שגויה — שביעות רצון היא חפיפה בין צרכים לתגובות, ולכן נדרשים שני הנתונים."},{"q":"לפניכם מספר טענות לגבי שלבי התפעול של CRM:\nטענה 1: הרצף הנכון של השלבים: Analytical ← Operational ← Communicational ← Collaborative\nטענה 2: השלב האנליטי עושה שימוש בכלים טכנולוגיים כגון Data Mining (כריית נתונים) ובינה מלאכותית\nטענה 3: השלב התקשורתי (Communicational) עוסק בשיתוף אחיד של המידע בין מחלקות הארגון","options":["טענות 2 ו-3","כל הטענות נכונות","טענות 1 ו-2","טענה 1 בלבד","טענה 2 בלבד"],"answer":2,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — שיתוף בין מחלקות = Collaborative; ה-Communicational עוסק בבחירת ערוצי ההתקשרות מול הלקוח."},{"q":"לפניכם מספר טענות לגבי יתרונות CRM:\nטענה 1: בין שמונת היתרונות המסכמים: שיפור שביעות רצון העובדים, חיסכון בעלויות והקטנת היקפי נטישת לקוחות\nטענה 2: המערכת משפרת את התקשורת הפנימית — למשל העברת פרטי מתעניינים ממחלקת שיווק למחלקת מכירות\nטענה 3: בדוגמת ה-Up-Sell מהשיעור: לקוח שרכש iPhone קיבל הצעה למטען אלחוטי בהנחה","options":["טענה 3 בלבד","טענות 2 ו-3","טענה 1 בלבד","טענות 1 ו-2","כל הטענות נכונות"],"answer":4,"explain":"שלוש הטענות נכונות — היתרונות המסכמים, התקשורת הפנימית ודוגמת המטען האלחוטי."},{"q":"לפניכם מספר טענות:\nטענה 1: מערכת שלגביה הוגדר כי היא יכולה לאפשר הגדרה נכונה יותר של תחומי האחריות בארגון היא מערכת CRM\nטענה 2: מערכות ERP ממוקדות בעיקר בניהול קמפיינים שהם מסעות פרסום משולבים\nטענה 3: שליטה וניהול טובים יותר של מלאים הוא אחד מהיתרונות שהוצגו בקורס הנובעים מיישום נכון של מערכות ERP","options":["טענה 1 בלבד","טענה 3 בלבד","טענה 2 בלבד","טענות 1 ו-3","כל הטענות שגויות"],"answer":1,"exam":true,"explain":"טענה 1 שגויה — תחומי אחריות = ERP. טענה 2 שגויה — קמפיינים = CRM. טענה 3 נכונה."},{"q":"לפניכם מספר טענות לגבי ERP:\nטענה 1: לפני התקנת המערכת נדרש ארגון מחדש של התהליכים העסקיים: הגדרתם, איתור כפילויות ושיפורם\nטענה 2: אינטגרציה ללא אוטומציה, או אוטומציה ללא אינטגרציה, מספקות את מלוא הערך של מערכת ERP\nטענה 3: המערכת מסייעת לקצר את זמן האספקה וכך משפרת גם את חוויית הלקוח","options":["כל הטענות נכונות","טענה 3 בלבד","טענות 1 ו-2","טענות 1 ו-3","טענה 1 בלבד"],"answer":3,"explain":"טענות 1 ו-3 נכונות. טענה 2 שגויה — נדרש השילוב של שני הממדים; אוטומציה בלי אינטגרציה יוצרת 'איים' מנותקים."},{"q":"לפניכם מספר טענות לגבי ERP:\nטענה 1: ניהול שרשרת האספקה במערכת קריטי במיוחד בחברות עתירות מלאי\nטענה 2: הודות לאינטגרציה, נתון מוזן פעם אחת וזמין לכל המחלקות — מה שמצמצם הקלדות כפולות ותיקונים\nטענה 3: המערכת מונעת לחלוטין את הצורך במחסנאים, אנשי לוגיסטיקה ומנהלי חשבונות","options":["טענות 1 ו-2","טענה 2 בלבד","כל הטענות נכונות","טענות 2 ו-3","טענה 1 בלבד"],"answer":0,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — המערכת מייעלת את העבודה אך אינה מבטלת את הצורך בבעלי התפקידים."},{"q":"לפניכם מספר טענות לגבי מסחר אלקטרוני:\nטענה 1: Web 2.0 הוא הדור השני של האינטרנט ויישומיו — אפליקציות אינטראקטיביות ודינמיות במקום דפים סטטיים\nטענה 2: תוכן מבוסס משתמש (UGC) כולל ביקורות, חוות דעת ודירוגים — כ ם — אלפי GB\nטענה 2: מקלדת, עכבר, סורק ומיקרופון הם התקני קלט; מסך, מדפסת ורמקולים — התקני פלט\nטענה 3: מהפכת הסלולר האיצה את התפתחות המעבדים, ועוצמת הביצועים שהושגה בסלולר שירתה גם מחשבים אישיים","options":["כל הטענות נכונות","טענה 1 בלבד","טענה 3 בלבד","טענות 1 ו-2","טענות 2 ו-3"],"answer":0,"explain":"שלוש הטענות נכונות — נפחי ה-RAM, הקלט/פלט והשפעת מהפכת הסלולר."},{"q":"לפניכם מספר טענות לגבי חומרה ותוכנה:\nטענה 1: תשתיות טכנולוגיות כוללות רכיבים פיזיים בלבד\nטענה 2: משל המכונית: החומרה היא השלד והתוכנה היא המנוע — מערכת משוכללת בפן החומרה לא תפעל ללא תוכנה מתאימה\nטענה 3: מערכות ההפעלה הנפוצות בטלפונים חכמים הן Android ו-iOS","options":["טענה 1 בלבד","טענה 2 בלבד","טענות 2 ו-3","טענה 3 בלבד","כל הטענות נכונות"],"answer":2,"explain":"טענות 2 ו-3 נכונות. טענה 1 שגויה — התשתיות כוללות רכיבים פיזיים ווירטואליים."},{"q":"לפניכם מספר טענות לגבי BI:\nטענה 1: בינה עסקית היא תהליך של איסוף, עיבוד וניתוח מידע כבסיס לקבלת החלטות\nטענה 2: BI הוא מושג חדש לגמרי שלא התקיים לפני העשור האחרון\nטענה 3: מסלול המידע: Data Warehouse ← Data Marts ← תהליכי ETL ← Visualization","options":["כל הטענות נכונות","טענות 1 ו-2","טענה 1 בלבד","טענה 3 בלבד","טענות 1 ו-3"],"answer":4,"explain":"טענות 1 ו-3 נכונות. טענה 2 שגויה — BI אינו חדש (גם ממוצע ציונים הוא BI בסיסי); מה שהתחדש הוא הכלים המתקדמים."},{"q":"לפניכם מספר טענות לגבי IoT:\nטענה 1: IoT — האינטרנט של הדברים — הוא מכשירים חכמים שאוספים נתונים ושולחים אותם למערכת מרכזית באופן רציף\nטענה 2: בית חכם עם חיישני טמפרטורה, תאורה ומצלמות הוא דוגמה ל-IoT\nטענה 3: שילוב IoT עם BI מאפשר, למשל, לזהות ששינוי טמפרטורה משפיע על חשבון החשמל — ולנתח בכמה","options":["טענות 1 ו-2","כל הטענות נכונות","טענות 2 ו-3","טענה 2 בלבד","טענה 1 בלבד"],"answer":1,"explain":"שלוש הטענות נכונות — ההגדרה, דוגמת הבית החכם ושילוב IoT+BI מהשיעור."},{"q":"לפניכם מספר טענות לגבי AI:\nטענה 1: AI קלאסי — הסקה לפי נוסחה או חוקים ברורים — התקיים כבר במערכות המידע של שנות ה-80\nטענה 2: ההגדרה המעשית: אם מחשב מסוגל להסיק, על בסיס תכנות, תוצאות או המלצות מרשימת ערכים — זו בי wer":1,"explain":"שלוש הטענות נכונות — הגדרת ML, ה-Label ודוגמת הפיקסלים והאפיון."}]});

swer":0,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — TPS מתעדת גם אירועים לא-כספיים (רישום כניסות, הרשמות, תיק רפואי)."},{"q":"לפניכם מספר טענות:\nטענה 1: היקף ותדירות — יכולת לטפל במיליוני עסקאות ביום — הוא אתגר מרכזי ש-TPS פותרת בארגוני ענק\nטענה 2: בדוגמת חשבון הבנק: משיכות, העברות (ביט) וחיובים מתועדים בדיוק, באמינות, באבטחה ובמהירות — TPS\nטענה 3: בשירותי הסטרימינג, ההמלצות המותאמות שנוצרות מעיבוד ההאזנות הן דוגמה ל-MIS","options":["טענה 1 בלבד","טענה 3 בלבד","כל הטענות נכונות","טענות 2 ו-3","טענות 1 ו-2"],"answer":2,"explain":"שלוש הטענות נכונות — היקף ותדירות, דוגמת הבנק ודוגמת הסטרימינג."},{"q":"לפניכם מספר טענות:\nטענה 1: בדוגמת ה-iPhone 15: לקוח מתלבט שאינו מוצא את המכשיר במלאי עלול לעבור למתחרה — ולכן ניהול המלאי ב-MIS קריטי\nטענה 2: מעקב אחר רמות מלאי בזמן אמת הוא אחת מיכולות ה-MIS בתחום המלאי ושרשרת האספקה\nטענה 3: מערכת MIS מספקת דשבורדים אסטרטגיים המשווים את החברה למתחרותיה","options":["טענה 2 בלבד","כל הטענות נכונות","טענות 2 ו-3","טענה 1 בלבד","טענות 1 ו-2"],"answer":4,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — דשבורדים אסטרטגיים והשוואה למתחרים = ESS."},{"q":"לפניכם מספר טענות:\nטענה 1: ESS מציגה למנהלים הבכירים תמונה מתומצתת, חזותית ועדכנית — במקום פירוט טבלאי\nטענה 2: הקצאת תקציבים ואסטרטגיות השקעה הם תחומים שבהם ESS תומכת\nטענה 3: מערכת ESS מיועדת בעיקר לניהול המלאי היום-יומי בחנות","options":["טענה 1 בלבד","טענות 1 ו-2","כל הטענות נכונות","טענות 1 ו-3","טענה 2 בלבד"],"answer":1,"explain":"טענות 1 ו-2 נכונות. טענה 3 שגויה — ניהול מלאי יום-יומי = MIS."},{"q":"לפניכם מספר טענות:\nטענה 1: כלל הזיהוי: \"תיעוד / רישום / זמן אמת\" = TPS; \"דוחות ניהוליים / שוטף\" = MIS; \"אסטרטגי / חיצוני / בכיר\" = ESS\nטענה 2: DSS (Decision Support System) הוא מושג שהוזכר בקורס — מערכת תומכת החלטה\nטענה 3: כיוון זרימת המידע הוא ESS ← MIS ← TPS: המערכת הבכירה מזינה את הנמוכות ממנה","options":["טענות 1 ו-3","כל הטענות נכונות","טענה 1 בלבד","טענות 1 ו-2","טענה 2 בלבד"],"answer":3,"explain":"טענות 1 ו-2 נכונות. טענה 3 הפוכה — הזרימה היא TPS ← MIS ← ESS."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: מערכת CRM תורמת לעלייה בהכנסות, בין היתר על ידי הבנה מה להדגיש וכיצד תמחור משפיע, ובאמצעות תוכניות נאמנות\nטענה 2: המושג טרגוט (Targeting) בהקשר CRM משמעו קביעת יעד תקציבי לכל לקוח\nטענה 3: הצעת מוצרים נוספים (Up-Sell) על בסיס ניתוח דפוסי קנייה היא מיתרונות המערכת","options":["טענות 1 ו-3","טענה 1 בלבד","טענה 3 בלבד","כל הטענות נכונות","טענות 1 ו-2"],"answer":0,"exam":true,"explain":"טענות 1 ו-3 נכונות. טענה 2 שגויה — טרגוט = קביעת קהל היעד לפי מאפייני לקוחות, לא יעד תקציבי."},{"q":"לפניכם מספר טענות לגבי מערכות CRM:\nטענה 1: רכיב שירות הלקוחות (Front Office) מתעד כל אינטראקציה בנקודת הממשק בין הלקוח לארגון\nטענה 2: ניהול קמפיינים כולל פרסום באמצעי מדיה שונים, מבצעים והשקות מוצרים\nטענה 3: ההגדרה הטכנית של CRM: שילוב כל הפרקטיקות, האסטרטגיות והטכנולוגיות לניהול וניתוח מידע לאורך כל מחזור חיי הלקוח","options":["טענה 1 בלבד","טענות 1 ו-2","טענות 2 ו-3","כל הטענות נכונות","טענה 3 בלבד"],"answer":3,"exam":true,"explain":"שלוש הטענות נכונות — Front Office, קמפיינים וההגדרה הטכנית המלאה."},{"q":"לפניכם מספר טענות לגבי CRM:\nטענה 1: נאמנות לקוחות היא נטיית הלקוח להמשיך ולרכוש, והמערכת מאפשרת ביצוע פעולות מתקנות כשהיא יורדת\nטענה 2: לקוחות מרוצים נוטים להיות נאמנים ולהמליץ — והמערכת מזהה ממליצים ומאפשרת לתגמל אותם\nטענה 3: אופטימיזציה של השיווק משמעה שיווק בזמן הנכון ולקהל הנכון, על בסיס הבנת הצרכים וההתנהגות","options":["טענה 1 בלבד","טענה 3 בלבד","טענות 1 ו-2","טענות 2 ו-3","כל הטענות נכונות"],"answer":4,"explain":"שלוש הטענות נכונות — נאמנות, ממליצים ואופטימיזציית השיווק מהשיעור."},{"q":"לפניכם מספר טענות לגבי CRM:\nטענה 1: מה שמבדיל CRM מודרנית מתיעוד פשוט: אינטגרציה של כל ערוצי ההתקשרות לתמונת לקוח אחת\nטענה 2: השלב האנליטי מזהה מגמות ומפיק תוצרי דיווח מתוך המידע שנאסף\nטענה 3: מערכת CRM מתאימה את המענה ללקוח לפי הבנה ופרשנות נכונה של בקשותיו (Customer Responses)","options":["טענות 1 ו-2","כל הטענות נכונות","טענות 1 ו-3","טענה 1 בלבד","טענה 2 בלבד"],"answer":1,"explain":"שלוש הטענות נכונות — האינטגרציה, השלב האנליטי ותגובות הארגו (function(){
"use strict";
var STORE_PREFIX = "mis_";
var UNITS = window.__MIS_UNITS__ || [];
var EXAMS = window.__MIS_EXAMS__ || [];

function store(key, val){
  try{
    if(val === undefined) return localStorage.getItem(STORE_PREFIX + key);
    localStorage.setItem(STORE_PREFIX + key, val);
  }catch(e){ return null; }
  return val;
}

var el = function(id){ return document.getElementById(id); };
var homeView, unitView, navList;
var current = null;

/* ---------- מצב תצוגה (נגישות) ---------- */
var THEMES = ["auto","dark","light"];
var THEME_LABELS = {auto:"🌓 אוטומטי", dark:"🌙 מצב כהה", light:"☀️ מצב בהיר"};
function applyTheme(t){
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  var b = el("themeBtn"); if(b) b.textContent = THEME_LABELS[t];
}
function initTheme(){
  var t = store("theme") || "auto";
  if(THEMES.indexOf(t) < 0) t = "auto";
  applyTheme(t);
  el("themeBtn").addEventListener("click", function(){
    var cur = store("theme") || "auto";
    var next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    store("theme", next);
    applyTheme(next);
  });
}

document.addEventListener("DOMContentLoaded", function(){
  homeView = el("homeView"); unitView = el("unitView"); navList = el("navList");
  initTheme();
  buildNav();
  renderHome();
  el("menuBtn").addEventListener("click", function(ev){
    ev.stopPropagation();
    if(el("sideNav").classList.contains("open")) closeNav(); else openNav();
  });
  el("navBackdrop").addEventListener("click", closeNav);
  document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeNav(); });
});

function buildNav(){
  navList.innerHTML = "";
  var home = document.createElement("div");
  home.className = "nav-item nav-home";
  home.textContent = "🏠 מסך הבית";
  home.addEventListener("click", function(){ renderHome(); closeNav(); });
  navList.appendChild(home);
  UNITS.forEach(function(u){
    var d = document.createElement("div");
    d.className = "nav-item";
    d.id = "nav-u" + u.id;
    var badge = "<span class='nv-badge'>" + u.questions.length + " ש'</span>";
    d.innerHTML = "<span>" + u.icon + "</span><span>" + u.id + ". " + u.shortTitle + "</span>" + badge;
    d.addEventListener("click", function(){ openUnit(u.id); closeNav(); });
    navList.appendChild(d);
  });
  if(EXAMS.length){
    var sep = document.createElement("div");
    sep.className = "nav-sep";
    sep.textContent = "🎓 מבחנים מסכמים";
    navList.appendChild(sep);
    EXAMS.forEach(function(ex, i){
      var d = document.createElement("div");
      d.className = "nav-item";
      d.id = "nav-e" + i;
      d.innerHTML = "<span>🎓</span><span>" + ex.title + "</span><span class='nv-badge'>" + ex.questions.length + " ש'</span>";
      d.addEventListener("click", function(){ openExam(i); closeNav(); });
      navList.appendChild(d);
    });
  }
}
function openNav(){ el("sideNav").classList.add("open"); el("navBackdrop").classList.add("show"); document.body.style.overflow = "hidden"; }
function closeNav(){ el("sideNav").classList.remove("open"); el("navBackdrop").classList.remove("show"); document.body.style.overflow = ""; }
function markNav(sel){
  navList.querySelectorAll(".nav-item").forEach(function(it){ it.classList.remove("active"); });
  if(sel){ var t = el(sel); if(t) t.classList.add("active"); }
  else { navList.querySelector(".nav-home").classList.add("active"); }
}

function totalQuestions(){
  return UNITS.reduce(function(s,u){ return s + u.questions.length; }, 0);
}

function renderHome(){
  current = null;
  markNav(null);
  unitView.classList.add("hidden");
  homeView.classList.remove("hidden");
  var html = "";
  html += "<div class='hero'><h1>💾 ניהול מערכות מידע — מערכת לימוד ותרגול</h1>" +
    "<p>10 יחידות עם סיכומים מלאים ו-" + totalQuestions() + " שאלות תרגול (כולל שאלות ממבחני אמת 🎓), ובנוסף " + EXAMS.length + " מבחנים מסכמים בפורמט המבחן האמיתי.</p>" +
    "<div class='hero-stats'>מבוסס על הרצאות ד\"ר שי צבאן · המרכז האקדמי פרס · קורס 860</div></div>";
  html += "<h2 style='margin:6px 0 12px;font-size:1.1rem;'>📚 יחידות הלימוד</h2><div class='cards'>";
  UNITS.forEach(function(u){
    var best = store("unit" + u.id + "_best");
    var bestHtml = best ? "<div class='uc-best'>🏆 שיא: " + best + "% הצלחה</div>" : "";
    html += "<div class='ucard' data-u='" + u.id + "'>" +
      "<div class='uc-icon'>" + u.icon + "</div>" +
      "<h3>יחידה " + u.id + " — " + u.title + "</h3>" +
      "<div class='uc-desc'>" + u.desc + "</div>" +
      "<div class='uc-meta'>📖 סיכום מלא · ✍️ " + u.questions.length + " שאלות תרגול</div>" +
      bestHtml + "</div>";
  });
  html += "</div>";
  if(EXAMS.length){
    html += "<h2 style='margin:26px 0 12px;font-size:1.1rem;'>🎓 מבחנים מסכמים — סימולציית המבחן האמיתי</h2><div class='cards'>";
    EXAMS.forEach(function(ex, i){
      var best = store("exam" + i + "_best");
      var bestHtml = best ? "<div class='uc-best'>🏆 שיא: " + best + "%</div>" : "";
      html += "<div class='ucard' data-e='" + i + "'>" +
        "<div class='uc-icon'>🎓</div><h3>" + ex.title + "</h3>" +
        "<div class='uc-desc'>" + ex.questions.length + " שאלות בפורמט הטענות של המבחן האמיתי. ללא משוב מיידי — ציון והסברים בסוף.</div>" +
        "<div class='uc-meta'>⏱️ מומלץ: עד שעה וחצי</div>" + bestHtml + "</div>";
    });
    html += "</div>";
  }
  homeView.innerHTML = html;
  homeView.querySelectorAll(".ucard[data-u]").forEach(function(c){
    c.addEventListener("click", function(){ openUnit(parseInt(c.getAttribute("data-u"),10)); });
  });
  homeView.querySelectorAll(".ucard[data-e]").forEach(function(c){
    c.addEventListener("click", function(){ openExam(parseInt(c.getAttribute("data-e"),10)); });
  });
  window.scrollTo(0,0);
}


/* ---------- הדפסה ---------- */

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function printDoc(title, subtitle, summaryHtml, questions, showBadge){
  var h = "<!DOCTYPE html><html lang='he' dir='rtl'><head><meta charset='utf-8'><title>" + esc(title) + "</title><style>" +
    "@page{margin:15mm;} body{font-family:Arial,'Segoe UI',sans-serif;color:#111;line-height:1.55;font-size:12.5px;margin:0;padding:10px 18px;} " +

    ".summary th,.summary td{border:1px solid #888;padding:4px 6px;vertical-align:top;text-align:right;} .summary th{background:#eee;} " +
    ".summary .hl{border:1px solid #666;background:#f4f4f4;padding:7px 10px;margin:8px 0;border-radius:4px;} .summary ul{padding-right:18px;} " +
    ".q{margin:0 0 12px;page-break-inside:avoid;} .qn{font-weight:700;} .badge{font-size:10px;border:1px solid #b8860b;color:#b8860b;border-radius:3px;padding:0 4px;margin-right:6px;} " +
    ".qt{margin:3px 0 4px;} .opts{padding-right:14px;margin:0;} .opts li{list-style:none;margin:1px 0;} " +
    ".ans{page-break-before:always;} .a{margin:0 0 8px;page-break-inside:avoid;} .a b{color:#0a5;} " +
    ".foot{margin-top:24px;font-size:10px;color:#777;text-align:center;border-top:1px solid #ccc;padding-top:6px;} " +
    "@media print{.noprint{display:none;}}</style></head><body>" +
    "<div class='noprint' style='text-align:center;margin-bottom:12px;'><button onclick='window.print()' style='padding:8px 24px;font-size:14px;cursor:pointer;'>🖨️ הדפסה / שמירה כ-PDF</button></div>" +
    "<h1>" + esc(title) + "</h1><div class='sub'>" + esc(subtitle) + "</div>";
  if(summaryHtml) h += "<h2>📖 סיכום</h2><div class='summary'>" + summaryHtml + "</div>";

    h += "<div class='q'><div class='qn'>שאלה " + (i+1) + (showBadge && q.exam ? " <span class='badge'>שאלת מבחן אמיתית</span>" : "") + "</div>" +
